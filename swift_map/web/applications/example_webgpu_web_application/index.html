<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwiftMap</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #map { position: relative; width: 100%; height: 100%; }
    #map canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <div id="map"><canvas id="map-canvas"></canvas></div>
  <script type="module">
    import { boot } from "./runtime/boot.js";
    boot({
      canvas: document.getElementById("map-canvas"),
      wasmURL: "./map.wasm",
      latitude: 37.7749,
      longitude: -122.4194,
      zoom: 12,
      annotations: [
        { id: "ferry", latitude: 37.7955, longitude: -122.3937, title: "Ferry Building" },
        { id: "goldengate", latitude: 37.8199, longitude: -122.4783, color: [0, 0.48, 1, 1], title: "Golden Gate Bridge" },
        { id: "alcatraz", latitude: 37.8270, longitude: -122.4230, color: [0.2, 0.78, 0.35, 1], radius: 10, title: "Alcatraz Island" },
      ],
      polylines: [{
        id: "ferryroute",
        coordinates: [
          [37.7955, -122.3937], [37.8080, -122.4090],
          [37.8210, -122.4180], [37.8270, -122.4230],
        ],
        color: [0, 0.48, 1, 0.9],
        width: 4,
      }],
      polygons: [{
        id: "goldengatepark",
        coordinates: [
          [37.7714, -122.5110], [37.7748, -122.4553],
          [37.7680, -122.4547], [37.7645, -122.5104],
        ],
        fillColor: [0.2, 0.78, 0.35, 0.35],
        strokeColor: [0.2, 0.78, 0.35, 1],
        strokeWidth: 3,
      }],
    }).catch((error) => {
      document.body.innerHTML = `<pre style="padding:16px">SwiftMap failed to start: ${error}</pre>`;
    });
  </script>
</body>
</html>
