# Fills the oss server's Bazel cache with main's builds after each merge
# (tools/ci/populate_cache.py): in a throwaway container of the image Visor
# makes agents' containers from (visor-agent:latest, which the runner's Mac
# has), with the checkout where a session sees isomer, each module's tests
# and the Linux, web and Android apps; and on the Mac itself the proof's
# Apple builds and the Mac's tests. An agent's container, an oss lease or a
# Mac that reads the cache then downloads what was built here.
#
# On the self-hosted runner of the Mac that runs agents' containers (an
# instance of its own, so it never queues behind pull requests' CI), and
# never for a pull request: the
# cache's write token is in the `bazel-cache` environment, which only main
# may use (Settings > Environments > bazel-cache: deployment branch main;
# the secret OSS_CACHE_WRITE_TOKEN, put there with
# `oss cache token --write | gh secret set OSS_CACHE_WRITE_TOKEN --env bazel-cache`
# on the oss server's Mac, and the variable OSS_CACHE_HOST, its address).
name: Bazel cache
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A newer main makes an older fill moot.
concurrency:
  group: bazel-cache
  cancel-in-progress: true
jobs:
  populate:
    runs-on: [self-hosted, macOS, isomer-cache]
    environment: bazel-cache
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Fill the cache
        env:
          OSS_CACHE_HOST: ${{ vars.OSS_CACHE_HOST }}
          # The oss server as the runner's containers reach it: its LAN IP
          # when the runner is on another Mac; unset on the oss server's own.
          OSS_CACHE_CONTAINER_HOST: ${{ vars.OSS_CACHE_CONTAINER_HOST }}
          OSS_CACHE_WRITE_TOKEN: ${{ secrets.OSS_CACHE_WRITE_TOKEN }}
        run: tools/ci/populate_cache.py
