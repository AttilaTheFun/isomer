# Every platform's Storybook built in a Linux container: iOS (the
# simulator's), macOS, web, Android and Linux, the Apple targets with
# rules_applecross, then the core's checks (the mock renderer's and the
# snapshots') in the same container. On a self-hosted runner whose Mac runs
# OS Server (tools/ci/container_build.sh: the container leased there, Xcode's
# SDK and the ported tools from its files).
#
# Pull requests and commits on main get the build and the checks. The proof
# (tools/ci/proof.sh) runs only when asked for by hand (workflow_dispatch),
# which is how an agent proposes a release: the Storybook and the
# Playground on every platform, pictured on machines leased from the same OS
# Server, each picture compared with the previous release's, uploaded as the
# `proof` artifact Reviews reads. A release is cut only from a main commit
# whose proof is in. The full set (every story) by default; the core set (a
# story from each area and the Playground's projects) as `quick`. To bisect
# a regression, prove earlier commits after the fact: push a branch at the
# commit and run the workflow on that branch (its proof is listed under the
# commit, as one on main would be).
#
# The two apps, the Storybook (com.LoganShire.IsomerStorybook) and the
# Playground (com.LoganShire.IsomerPlayground), are published to
# Applications Server for the iPhone and iPad (.ipa), the Mac (.zip) and
# Android (.apk), as AttilaTheFun/reviews' CI publishes Reviews:
# - alpha: the Alpha (--config=alpha) of each commit on main, after
#   `container`: its version asked of Applications Server and stamped in
#   (tools/ci/stamp_apps.sh), the apps built in a Linux container
#   (tools/ci/container_build.sh package), the Mac apps' icons checked for
#   the dark appearance (tools/ci/check_mac_icons.sh), unsigned, and
#   published to the server (tools/ci/publish_from_ci.sh), which signs the
#   Apple ones (and notarizes the Mac's); an .apk goes as its build signed it;
# - adhoc: the same with --config=adhoc for a branch that is neither main
#   nor a release branch, run by hand with `run: adhoc` (`gh workflow run
#   Build --ref <branch> -f run=adhoc`): how an agent tries the pipeline
#   before merging, and how a pull request's build reaches a phone. The
#   server takes it as an AdHoc build. No proof then: a run by hand is the
#   proof or the AdHoc build, not both;
# - release: when the owner publishes a GitHub release (a v* tag on a main
#   commit with its proof): the iPhone's and the Mac's Alphas of that commit
#   promoted to production by the server (nothing Apple rebuilt), Android's
#   built with --config=prod and published, and the release given its
#   assets: the proof, the Mac apps' disk images, the Android apps and the
#   iPhone apps for the simulator.
# No signing key, notary key or password here: the publishing jobs' OIDC
# token says where their builds came from, and which commit's version they
# are given (AttilaTheFun/applications' docs/CI.md).
#
# Only branches of this repository run it: a self-hosted runner never runs a
# fork's code. GitHub's own Linux runners can take what needs no SDK (Linux,
# web, Android) once they're wanted.
name: Build
on:
  push:
    # main's commits (a release is a published GitHub release, below).
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run:
        description: What to run by hand (adhoc on a branch other than main or a release branch)
        type: choice
        options: [proof, adhoc]
        default: proof
      kind:
        description: The proof's kind
        type: choice
        options: [full, quick]
        default: full
      baseline_run:
        description: A run whose proof to compare with (empty for the previous release's)
        required: false
        default: ""
# A pull request's newer push (a rebase, an update with main) cancels its
# older run, whose result no longer counts. Every other run (main's, a
# release's, a proof by hand) is a group of its own: GitHub keeps one
# pending run a group and cancels the rest, which would skip main's commits.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || format('build-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# What the publishing jobs build, each with its own --config: the Storybook's
# and the Playground's iPhone and iPad apps (device builds, signed ad hoc with
# a placeholder profile by --config=ci_device, which the server signs again
# with the bundle id's own), Mac apps and Android apps (their android_binary,
# whose signed .apk is published), optimized, as they ship. Flags as
# --name=value (tools/ci/container_build.sh package).
# The Playground's compilers come staged from OS Server's files (each job's
# "The Playground's compilers", tools/ci/stage_playground_compilers.sh): the
# iPhone's links the device's in (--define=iso_playground_embedded=1, which
# nothing else reads), the Mac's Resources take the Mac's staged one (built
# in the Linux container, the building machine's compiler would be Linux's:
# shared/compiler/toolchain.bzl), and the APK carries Android's.
env:
  PUBLISHED_APPS: >-
    --config=ci_device --compilation_mode=opt --define=iso_playground_embedded=1
    //apple/storybook_ios_application:storybook_ios_application
    //apple/storybook_macos_application:storybook_macos_application
    //android/storybook_android_application:storybook_android_application_apk
    //playground/apple/playground_ios_application:playground_ios_application
    //playground/apple/playground_macos_application:playground_macos_application
    //playground/android/playground_android_application:playground_android_application_apk

jobs:
  container:
    # Not for an AdHoc build by hand, which builds what it publishes itself.
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      inputs.run != 'adhoc'
    runs-on: [self-hosted, isomer-jit]
    # OS Server's single-use Linux containers (the image Visor's sessions
    # work in), its cache's read token and cache already in them: the job's
    # own container builds, and leases what runs elsewhere through oss.
    timeout-minutes: 180
    env:
      # A public repository's Android tests run on GitHub's own Ubuntu
      # runner (the `android` job: free, with KVM), from an x86_64 test APK
      # built here; a private copy's on an emulator leased from OS Server.
      ISOMER_ANDROID_X86_64: ${{ !github.event.repository.private && '1' || '' }}
      PLATFORM_TESTS: ${{ github.event.repository.private && 'android apple' || 'apple' }}
    steps:
      - uses: actions/checkout@v5
      # Every platform built in the Linux container (Windows on Arm with
      # --config=windows_on_linux), and the tests that run there: the core's,
      # the GL backend's, the web Storybook in headless Chrome and the Linux
      # one under Xvfb. The apps tested elsewhere go to .ci/platforms.
      - name: Build, and the tests in the build container
        run: exec tools/ci/container_build.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: android-test-apk
          path: .ci/platforms/android-x86_64
          retention-days: 3
      # The other platforms where they run, at once: Windows under arm64
      # Wine in a container (when PLATFORM_TESTS names it), Android on an
      # emulator leased from OS Server (its Mac's own hypervisor) in a
      # private copy, and the iPhone and the Mac on slots of OS Server's
      # primary macOS VM.
      - name: The other platforms' tests
        run: exec tools/ci/platform_tests.sh .ci/platform-tests
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: platform-tests
          path: .ci/platform-tests
          retention-days: 14

  android:
    # The Android Storybook's tests on GitHub's own Ubuntu runner, the
    # emulator on its KVM (tools/ci/hosted_android_test.sh), for a public
    # repository; a private one runs them in `container`, on OS Server.
    needs: container
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apk
          path: .ci/android
      - name: The Android Storybook's tests
        run: exec tools/ci/hosted_android_test.sh .ci/android/storybook.apk .ci/platform-tests/android
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: platform-tests-android
          path: .ci/platform-tests/android
          retention-days: 14

  proof:
    # After the build: no proof of a tree that doesn't build.
    needs: container
    # Only when asked for by hand: never a pull request's or a push's.
    if: github.event_name == 'workflow_dispatch' && inputs.run != 'adhoc'
    # OS Server's single-use Linux containers, as the build's: the apps built
    # in it (rules_applecross for the Apple ones). A public repository's are
    # then pictured on GitHub's own machines (the proof-* jobs below), but
    # the Android Playground, pictured here on an emulator leased from OS
    # Server (its compiler is arm64's alone; GitHub's runners with KVM are
    # x86_64). A private copy pictures everything here, on machines it
    # leases, the web in Chrome for Testing in this container.
    runs-on: [self-hosted, isomer-jit]
    concurrency:
      group: isomer-proof-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 240
    permissions:
      contents: read
      # The baseline: an earlier run's proof artifact.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      # The branch, for a pull request's head (its run's ref is GitHub's merge).
      PROOF_REF: ${{ github.event.pull_request && format('refs/heads/{0}', github.head_ref) || github.ref }}
      PROOF_KIND: ${{ inputs.kind || 'full' }}
      PROOF_BASELINE_RUN: ${{ inputs.baseline_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request's own head, not GitHub's merge of it: the commit
          # its proof is listed under. The whole history: the baseline is
          # found along the base branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: The apps on every platform, pictured, and the proof
        if: github.event.repository.private
        # exec: the runner's cancel reaches the script's trap, which releases its leases.
        run: exec tools/ci/proof.sh --kind "$PROOF_KIND" --proof "$RUNNER_TEMP/proof"
      # The proof whether every picture came or not: a broken screen is what it's for.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event.repository.private }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90
      - name: The apps built, and the Android Playground pictured
        if: ${{ !github.event.repository.private }}
        run: exec tools/ci/proof.sh --stage build --kind "$PROOF_KIND" --apps "$RUNNER_TEMP/proof-apps" --review "$RUNNER_TEMP/proof-review"
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: proof-apps-ios
          path: ${{ runner.temp }}/proof-apps/ios
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: proof-apps-macos
          path: ${{ runner.temp }}/proof-apps/macos
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: proof-apps-android
          path: ${{ runner.temp }}/proof-apps/hosted/android
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: proof-apps-web
          path: ${{ runner.temp }}/proof-apps/web
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !github.event.repository.private }}
        with:
          name: proof-part-build
          path: ${{ runner.temp }}/proof-review
          retention-days: 7

  # A public repository's proof, pictured on GitHub's own machines, free
  # for one (tools/ci/proof.sh --stage shoot, tools/proof/proof.py --here):
  # the iPhone (a simulator made for the run) and the Mac on `xcode-27`
  # Macs, the Android Storybook on an emulator under Ubuntu's KVM, the web
  # in Ubuntu's Chrome. Each its own part, whatever came back: a broken
  # screen is what the proof is for.
  proof-shoot:
    needs: proof
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: xcode-27
          - platform: macos
            runner: xcode-27
          - platform: android
            runner: ubuntu-24.04
          - platform: web
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # A quick proof's stories include those of the story files a branch touches.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: proof-apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/apps/${{ matrix.platform == 'android' && 'hosted/android' || matrix.platform }}
      - name: The apps pictured here
        env:
          PROOF_KIND: ${{ inputs.kind || 'full' }}
        run: >-
          exec tools/ci/proof.sh --stage shoot --platform ${{ matrix.platform }} --kind "$PROOF_KIND"
          --apps "$RUNNER_TEMP/apps" --review "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-part-${{ matrix.platform }}
          path: ${{ runner.temp }}/review
          retention-days: 7

  # The parts compared with the baseline into the `proof` artifact Reviews
  # reads, whichever came back (a missing platform's pictures fail it).
  proof-compare:
    needs: [proof, proof-shoot]
    if: ${{ !cancelled() && !github.event.repository.private && needs.proof.result == 'success' }}
    runs-on: [self-hosted, isomer-jit]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROOF_REF: ${{ github.event.pull_request && format('refs/heads/{0}', github.head_ref) || github.ref }}
      PROOF_KIND: ${{ inputs.kind || 'full' }}
      PROOF_BASELINE_RUN: ${{ inputs.baseline_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: proof-part-*
          path: ${{ runner.temp }}/parts
      - name: The proof
        run: exec tools/ci/proof.sh --stage compare --kind "$PROOF_KIND" --parts "$RUNNER_TEMP/parts" --proof "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90

  alpha:
    # After container: nothing published from a tree that doesn't build.
    needs: container
    # The Alpha of each commit on main, never a pull request's nor a release
    # branch's (release, below).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, isomer-jit]
    timeout-minutes: 120
    permissions:
      contents: read
      # The OIDC token Applications Server checks.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      # The builds' version, 0.39.N: the next of the committed line for the
      # token's commit, from Applications Server (the Playground's number,
      # which releases are tagged with), stamped into the checkout (both
      # apps' Info.plists, Android's versionName and versionCode) before the
      # build and never committed.
      - name: Version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/stamp_apps.sh
      # The Playground's compilers from OS Server's files, into the
      # checkout's gitignored folders, which the container sees: the
      # iPhone's (linked into the device's app), the Mac's (its Resources')
      # and Android's (the APK's).
      - name: The Playground's compilers
        run: tools/ci/stage_playground_compilers.sh ios-device macos android
      # Built in a Linux container, as everything else is, with
      # rules_applecross's actool, which compiles the Icon Composer icons'
      # dark and tinted appearances. Bazel's tree a volume of the publishing
      # jobs' own, kept between runs. exec: the runner's cancel reaches oss,
      # which ends the build and releases the container.
      - name: Build
        env:
          ISOMER_CI_VOLUME: isomer-ci-publish
        run: exec tools/ci/container_build.sh package .ci/packages --config=alpha $PUBLISHED_APPS
      # Nothing is published if a Mac app's icon has no dark appearance.
      - name: The icons' dark appearance
        run: tools/ci/check_mac_icons.sh .ci/packages
      # Untrusted text reaches the shell through env, never ${{ }} in run.
      - name: Notes
        env:
          SUMMARY: ${{ github.event.head_commit.message }}
        run: printf '%s\n' "$SUMMARY" > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" .ci/packages/*.zip .ci/packages/*.ipa .ci/packages/*.apk

  # AdHoc: a branch built by hand (workflow_dispatch with run: adhoc, on a
  # branch that is neither main nor a release branch), the apps built as
  # alpha's are with --config=adhoc and published; the server takes them as
  # AdHoc builds, kept a week. Not after container, which a run by hand
  # skips for it: the build itself stops a tree that doesn't build.
  adhoc:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.run == 'adhoc' &&
      github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release-')
    runs-on: [self-hosted, isomer-jit]
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/stamp_apps.sh
      - name: The Playground's compilers
        run: tools/ci/stage_playground_compilers.sh ios-device macos android
      - name: Build
        env:
          ISOMER_CI_VOLUME: isomer-ci-publish
        run: exec tools/ci/container_build.sh package .ci/packages --config=adhoc $PUBLISHED_APPS
      - name: The icons' dark appearance
        run: tools/ci/check_mac_icons.sh .ci/packages
      # The branch's commit's message, from git: a run by hand has no
      # head_commit in its event.
      - name: Notes
        run: git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" .ci/packages/*.zip .ci/packages/*.ipa .ci/packages/*.apk

  # A release: when the owner publishes a GitHub release (its v0.40.N tag on
  # a main commit, whose proof is in). Nothing Apple is rebuilt: the
  # iPhone's and the Mac's Alphas main's CI published of that commit (the
  # builds the owner tested) are promoted by Applications Server, stamped
  # Production and signed again (tools/ci/promote_from_ci.sh). Android's
  # are built for production and published, the server signing none. The
  # release then carries its proof, the Mac apps' disk images, the Android
  # apps and the iPhone apps for the simulator (tools/ci/release_assets.sh).
  release:
    if: github.event_name == 'release'
    runs-on: [self-hosted, isomer-jit]
    timeout-minutes: 120
    permissions:
      # The release's assets.
      contents: write
      # Its commit's proof artifact.
      actions: read
      # The OIDC token Applications Server checks: a v* tag's, by a releaser.
      id-token: write
    steps:
      # The tag's commit, with main's history beside it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A release is a main commit: a tag whose commit isn't on main stops here.
      - name: The release is a main commit
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME's commit is not on main"; exit 1; }
      # No release without its proof: found first, before anything is promoted.
      - name: Its proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/release_assets.sh proof "$GITHUB_REF_NAME" .ci/release
      # Untrusted text reaches the shell through env, never ${{ }} in run.
      - name: Notes
        env:
          BODY: ${{ github.event.release.body }}
        run: printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"
      - name: The iPhone's and the Mac's, promoted
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/promote_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" --dmg-dir .ci/release
      # Android's and the simulator's builds: the version main's Alpha of
      # the commit was (the server's answer for the token's commit).
      - name: Version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/stamp_apps.sh
      - name: The Playground's compilers
        run: tools/ci/stage_playground_compilers.sh ios-simulator android
      - name: Android's, for production
        env:
          ISOMER_CI_VOLUME: isomer-ci-publish
        run: >-
          tools/ci/container_build.sh package .ci/android --config=prod --compilation_mode=opt
          //android/storybook_android_application:storybook_android_application_apk
          //playground/android/playground_android_application:playground_android_application_apk
      - name: Android's, published
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" .ci/android/*.apk
      - name: The iPhone's, for the simulator
        env:
          ISOMER_CI_VOLUME: isomer-ci-publish
        run: >-
          tools/ci/container_build.sh package .ci/simulator --compilation_mode=opt --ios_multi_cpus=sim_arm64
          //apple/storybook_ios_application:storybook_ios_sim_application
          //playground/apple/playground_ios_application:playground_ios_sim_application
      - name: The release's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/release_assets.sh upload "$GITHUB_REF_NAME" .ci/release .ci/android .ci/simulator
