# Isomer's CI, by the owner's policy for protected repositories
# (AttilaTheFun/reviews' docs/CI_POLICY.md) and the shape the owner set on
# 2026-11-08: the tests without a GUI before a merge, every build after
# one, the GUI tests by hand, and the screenshot proof only ahead of a
# release (run: release, or run: proof by hand). Since
# 2026-11-15 on GitHub's own standard runners alone (a fork runs it as it
# is; AGENTS.md, "The release proof" and "Signing"): the web, Linux and
# Android together, one job and one Bazel output base, in Swift's image (by
# digest) on x86_64 Ubuntu, with the Linux apps' libraries added
# (tools/ci/job_tools.sh; Android's SDK tools are x86_64, and the project's
# own image is arm64 alone); the Apple targets on
# `xcode-27` Macs with their own Xcode (Apple's SDKs may not be
# redistributed); Windows on windows-11-arm with swift.org's Swift and the
# image's own Visual Studio, built only (tier 2). Bazel's
# caches are GitHub's (.github/actions/bazel_cache), written by main's
# builds alone, and BuildBuddy's remote cache, its key the
# BUILDBUDDY_API_KEY secret (read and write), handed to the cache action's
# setup alone and only in runs on main and a published release's: never to
# a pull request or a branch's run, whose scripts could upload with it
# (tools/ci/ci_bazel.sh: main's push builds and the release jobs write;
# main's other runs by hand read). Pull requests build on GitHub's cache
# alone until a read-only key (BUILDBUDDY_READ_KEY) is theirs.
#
# - pull requests: container (web, Linux, Android; the required check),
#   container-apple, container-windows: every target
#   built, then every test that draws nothing (container_build.sh pr).
# - main's commits: populate, populate-apple,
#   populate-windows (the same, and what a release builds, into the cache;
#   never a proof); bazel8, bazel8-apple.
# - by hand (`run:`): verify (the builds and tests, no proof: verify,
#   verify-apple, verify-windows, container-verify, apple,
#   android); proof (the screenshot proof alone: proof, proof-apple,
#   proof-android, proof-shoot, proof-compare); prerelease (main: the
#   Alphas, alpha-apple and alpha, signed with the `release` environment's
#   keys by build_tools' `sign` and drafted); release (main: verify's
#   jobs and the proof, then the Alphas and a draft proposed for release;
#   the one run that proves and verifies at once, which tools/ci/verified.sh
#   asks for);
#   experiment (any branch but a release branch: the Storybook Lab drafted
#   unsigned, as no environment's keys reach a branch); waydroid-probe (a
#   probe: whether Waydroid's Android boots on GitHub's hosted x86_64
#   Ubuntu, tools/ci/waydroid_probe.sh; nothing depends on it). There is no adhoc
#   run: a branch's builds are experiments only (the owner, 2026-11-12).
#   Drafts are CI's: no agent publishes one or makes a tag.
# - a published release (its v* tag, made in Reviews): verified
#   (tools/ci/verified.sh), the proposal's Apple Alphas stamped Production
#   and signed again (nothing Apple rebuilt), Android's built for
#   production and signed, the assets attached (release-apple, release).
# The signing keys reach only the alpha and release jobs' signing steps.
name: Build
on:
  push:
    # main's commits: populate.
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run:
        description: "What to run: verify (the tests, no proof), prerelease or release on main (verify on a branch to bisect); proof (the screenshot proof alone); experiment on any but a release branch; waydroid-probe (a probe of Waydroid on the hosted runner) on any; sdk-smoke (a consumer of Isomer's Swift SDKs, the ones this commit registers) on any"
        type: choice
        options: [verify, proof, prerelease, release, experiment, waydroid-probe, sdk-smoke]
        default: verify
      kind:
        description: The proof's kind
        type: choice
        options: [full, quick]
        default: full
# A pull request's newer push (a rebase, an update with main) cancels its
# branch's older run, whose result no longer counts. Every other run
# (populate, a run by hand, a release) is a group of its own and never
# cancelled, so a publish is never cut off halfway.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.head_ref) || format('build-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# What the publishing jobs build (flags as --name=value): the Apple apps on
# a Mac, Android's and the site on Linux. The Android release key and its
# certificate, pinned (build_tools' `sign android`).
env:
  PUBLISHED_APPLE: >-
    --config=ci_device --compilation_mode=opt
    //apple/storybook_ios_application:storybook_ios_application
    //apple/storybook_macos_application:storybook_macos_application
  PUBLISHED_LINUX: >-
    --compilation_mode=opt
    //android/storybook_android_application:storybook_android_application_apk
    //web/storybook_web_application:isomer_site
  ANDROID_KEY: storybook
  ANDROID_PIN: 15B0FF4BA3BDD9EEE725C8A2E06D11513055B064DE899A09243BFA5370500959

jobs:
  # --- Pull requests: every platform built, the tests that draw nothing ---

  # The web, Linux and Android in one job, one Bazel output base on the
  # runner's second disk: Swift's image on x86_64 (Android's SDK tools are
  # x86_64), the Linux apps' libraries added by job_tools.sh.
  container:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      # Bazel's tree on the runner's second disk (ISOMER_BAZEL_ROOT).
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: web linux android
      ISOMER_ANDROID_X86_64: "1"
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
      - name: Every target built, and the tests that draw nothing
        env:
          ISOMER_EXECUTION_LOGS: ${{ runner.temp }}/execution-logs
        run: exec tools/ci/container_build.sh pr
      # What each invocation ran, to find what the cache misses.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: execution-logs
          path: ${{ runner.temp }}/execution-logs
          retention-days: 7

  container-apple:
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: apple
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
      - name: The Apple targets built, with this Mac's Xcode
        run: exec tools/ci/container_build.sh pr

  # Windows, built natively on GitHub's windows-11-arm (tools/ci/windows_build.ps1):
  # tier 2, not a required check.
  container-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      ISOMER_BAZEL_ROOT: C:/b
    steps:
      - uses: actions/checkout@v5
      - name: Swift for Windows
        shell: pwsh
        run: tools/ci/windows_build.ps1 setup
      - uses: ./.github/actions/bazel_cache
        with:
          group: windows
      # Built only (Windows is tier 2): the Storybook, then with its driver
      # and the Storybook's tests for Windows.
      - name: The Windows Storybook and its headful tests, built
        shell: pwsh
        run: |
          tools/ci/windows_build.ps1 build '--keep_going' '//windows/storybook_windows_application'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools/ci/windows_build.ps1 build '--keep_going' '--@isomer//drive:headful' '//windows/storybook_windows_application' '//headless/storybook_headless_application:storybook_headful_windows_test'
          exit $LASTEXITCODE

  # --- main: the merged tree built into GitHub's cache ---------------------

  populate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: web linux android
      ISOMER_ANDROID_X86_64: "1"
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - id: cache
        uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: The merged tree, built into the cache
        env:
          ISOMER_EXECUTION_LOGS: ${{ runner.temp }}/execution-logs
        run: exec tools/ci/container_build.sh all
      # And what a release builds here: the Android app and the site as
      # alpha builds them (never the proof's apps: no proof on a push).
      - name: The published Android app and site, built into the cache
        run: exec tools/ci/container_build.sh package .ci/packages --config=alpha $PUBLISHED_LINUX
      # The web, Linux and Android's share of GitHub's 10 GB: what the two
      # groups (linux 3, android 2) had.
      - uses: ./.github/actions/bazel_cache_save
        if: ${{ !cancelled() }}
        with:
          group: ubuntu
          gigabytes: 5
          repository-hit: ${{ steps.cache.outputs.repository-hit }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: execution-logs
          path: ${{ runner.temp }}/execution-logs
          retention-days: 7

  populate-apple:
    if: github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: apple
    steps:
      - uses: actions/checkout@v5
      - id: cache
        uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: The merged tree's Apple targets, built into the cache
        run: exec tools/ci/container_build.sh all
      - name: The published Apple apps, built into the cache
        run: exec tools/ci/container_build.sh package .ci/packages --config=alpha $PUBLISHED_APPLE
      - uses: ./.github/actions/bazel_cache_save
        if: ${{ !cancelled() }}
        with:
          group: apple
          gigabytes: 2
          repository-hit: ${{ steps.cache.outputs.repository-hit }}

  populate-windows:
    if: github.event_name == 'push'
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      ISOMER_BAZEL_ROOT: C:/b
    steps:
      - uses: actions/checkout@v5
      - name: Swift for Windows
        shell: pwsh
        run: tools/ci/windows_build.ps1 setup
      - id: cache
        uses: ./.github/actions/bazel_cache
        with:
          group: windows
      # Built only (Windows is tier 2): the Storybook, then with its driver
      # and the Storybook's tests for Windows.
      - name: The Windows Storybook and its headful tests, built
        shell: pwsh
        run: |
          tools/ci/windows_build.ps1 build '--keep_going' '//windows/storybook_windows_application'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools/ci/windows_build.ps1 build '--keep_going' '--@isomer//drive:headful' '//windows/storybook_windows_application' '//headless/storybook_headless_application:storybook_headful_windows_test'
          exit $LASTEXITCODE
      - uses: ./.github/actions/bazel_cache_save
        if: ${{ !cancelled() }}
        with:
          group: windows
          gigabytes: 1
          repository-hit: ${{ steps.cache.outputs.repository-hit }}

  bazel8:
    # The Storybooks built with the oldest Bazel isomer supports: the web,
    # Linux and Android together, as container builds them.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 180
    env:
      USE_BAZEL_VERSION: 8.5.0
      ISOMER_PLATFORMS: web linux android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          disk: "false"
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      # Built only (container_build.sh's checks take Bazel 9's test flags).
      - name: The Storybooks with Bazel 8.5.0
        run: >-
          exec tools/ci/container_build.sh
          //web/storybook_web_application:storybook_web_application
          //linux/storybook_linux_application:storybook_linux_application
          //android/storybook_android_application:storybook_android_application_apk

  bazel8-apple:
    if: github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      USE_BAZEL_VERSION: 8.5.0
      ISOMER_PLATFORMS: apple
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
          disk: "false"
      - name: The Apple Storybooks with Bazel 8.5.0
        run: >-
          exec tools/ci/container_build.sh --ios_multi_cpus=sim_arm64
          //apple/storybook_ios_application:storybook_ios_sim_application
          //apple/storybook_isomer_ios_application
          //apple/storybook_macos_application:storybook_macos_application

  # --- By hand: Isomer's Swift SDKs as a consumer links them -------------

  # tests/sdk_consumer (docs/hermetic_toolchains.md, "The SDKs' checks"), a
  # consumer shaped as an app outside this repository (Bazel 8, minSdk 23,
  # a kt_swift_library's JNI library, an isolated swift_deps graph, an older
  # bazel_features), built at the previous release first and then upgraded
  # in the same output base to this commit's isomer and the SDKs it
  # registers (examples/MODULE.bazel's), by the lines a consumer's upgrade
  # changes (tools/ci/sdk_smoke cell); isomer_hermetic_toolchains' release
  # run builds the same consumer against SDKs not yet released (its
  # isomer_sdk.yml). Each cell: the JNI library for aarch64 and
  # x86_64, the APKs, the WASI command run under WasmKit; then the x86_64
  # APK on an emulator at the cell's API (sdk-smoke-android).
  # `bazel run --symlink_prefix=/`: no convenience symlinks at isomer's root,
  # where Package.swift's Isomer target (path ".") would take the
  # examples' .lproj under them for resources (tools/ci/sdk_smoke refuses
  # them).
  sdk-smoke:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'sdk-smoke' || inputs.run == 'release')
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, i18n]
        api: [23, 28]
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 120
    env:
      ISOMER_PLATFORMS: android
      # The release consumers upgrade from (README, "Upgrading isomer"),
      # moved on at each release.
      PREVIOUS_ISOMER: "0.57.1"
      PREVIOUS_SDK: https://github.com/AttilaTheFun/isomer_hermetic_toolchains/releases/download/isomer-6.4.2.1
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      # The downloads' mirrors and the repository cache with the Maven
      # artifacts' cache in it, for isomer's Bazel and the consumer's
      # (tools/ci/ci_bazel.sh writes the consumer's .bazelrc.user too); no
      # disk cache: the consumer's builds are its own.
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          disk: "false"
      # The previous release at API 28, where it linked (isomer-6.4.2.1's
      # SDKs were compiled for 28), its output base kept for the upgrade.
      - name: The consumer at the previous release
        run: |
          bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- cell --isomer "$PREVIOUS_ISOMER" --sdk-base-url "$PREVIOUS_SDK" --variant ${{ matrix.variant }} --api 28
          bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- build --no-apks --no-wasm --startup-arg=--output_base=/mnt/consumer
      - name: Upgraded to this commit and the SDKs it registers
        run: |
          base="$(sed -n 's|^ *url = "\(.*\)/swift-6.4.2-RELEASE_android.*|\1|p' examples/MODULE.bazel | head -1)"
          bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- cell --isomer "$PWD" --sdk-base-url "$base" --variant ${{ matrix.variant }} --api ${{ matrix.api }}
          bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- build --startup-arg=--output_base=/mnt/consumer
          # The APKs with rules_android 0.7.3 (0.6.0's tools' Maven is unpinned).
          bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- cell --isomer "$PWD" --sdk-base-url "$base" --variant ${{ matrix.variant }} --api ${{ matrix.api }} --rules-android 0.7.3
          bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- build --no-wasm --out "$GITHUB_WORKSPACE/.ci/sdk-smoke" --startup-arg=--output_base=/mnt/consumer
          cp tests/sdk_consumer/cell.bzl "$GITHUB_WORKSPACE/.ci/sdk-smoke/"
      # One directory, named relative to the workspace (.ci/, which git
      # ignores, as verify's artifacts are): in a container job
      # ${{ runner.temp }} names the runner's directory, not the container's
      # /__w/_temp, and of two such paths only one was found (the least
      # common ancestor "/", the APK alone; release run 44635158410).
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-smoke-${{ matrix.variant }}-${{ matrix.api }}
          path: .ci/sdk-smoke/
          if-no-files-found: error
          retention-days: 1

  sdk-smoke-android:
    # The cell's x86_64 APK on an emulator at its API, on GitHub's KVM
    # (tools/ci/hosted_android_emulator.sh with the API's AOSP image).
    needs: sdk-smoke
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'sdk-smoke' || inputs.run == 'release') }}
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, i18n]
        api: [23, 28]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The sdk-smoke job's .ci/sdk-smoke/ (smoke_x86_64.apk, cell.bzl), at
      # the same path here.
      - uses: actions/download-artifact@v4
        with:
          name: sdk-smoke-${{ matrix.variant }}-${{ matrix.api }}
          path: .ci/sdk-smoke
      # sdk_smoke is built here, on the runner itself (the emulator wants its
      # KVM): its FoundationNetworking links libcurl, whose development
      # package the runner's image hasn't.
      - name: The tool's libcurl
        run: sudo apt-get install -y -qq libcurl4-openssl-dev > /dev/null
      # The downloads' mirrors and retries for sdk_smoke's build (no cache).
      - name: Bazel's settings
        run: tools/ci/ci_bazel.sh setup
      - name: The emulator at API ${{ matrix.api }}
        run: |
          cp .ci/sdk-smoke/cell.bzl tests/sdk_consumer/cell.bzl
          tools/ci/hosted_android_emulator.sh .ci/emulator.log .ci/serial "system-images;android-${{ matrix.api }};default;x86_64" < /dev/null > /dev/null
      - name: The checks on Android ${{ matrix.api }}
        run: bazel run --symlink_prefix=/ //tools/ci/sdk_smoke -- run-android --adb "$ANDROID_HOME/platform-tools/adb" --serial "$(cat .ci/serial)" --apk "$PWD/.ci/sdk-smoke/smoke_x86_64.apk"

  # --- By hand: verify (the GUI tests) ------------------------------------

  verify:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: web linux android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: Build, and the tests in the build container
        run: exec tools/ci/container_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: .ci/platforms/android-x86_64
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: headful-apps-android
          path: .ci/platforms/headful
          retention-days: 3

  verify-apple:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: apple
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: Build, with this Mac's Xcode
        run: exec tools/ci/container_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: apple-test-apps
          path: |
            .ci/platforms/*storybook_ios*.ipa
            .ci/platforms/*storybook_macos*.zip
            .ci/platforms/*webview_ios*.ipa
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: headful-apps-apple
          path: .ci/platforms/headful
          retention-days: 3

  verify-windows:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      ISOMER_BAZEL_ROOT: C:/b
    steps:
      - uses: actions/checkout@v5
      - name: Swift for Windows
        shell: pwsh
        run: tools/ci/windows_build.ps1 setup
      - uses: ./.github/actions/bazel_cache
        with:
          group: windows
      # Built only (Windows is tier 2): the Storybook, then with its driver
      # and the Storybook's tests for Windows.
      - name: The Windows Storybook and its headful tests, built
        shell: pwsh
        run: |
          tools/ci/windows_build.ps1 build '--keep_going' '//windows/storybook_windows_application'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools/ci/windows_build.ps1 build '--keep_going' '--@isomer//drive:headful' '//windows/storybook_windows_application' '//headless/storybook_headless_application:storybook_headful_windows_test'
          exit $LASTEXITCODE

  container-verify:
    # By hand, beside verify and apple: the tests that draw, in a Linux
    # container. The web Storybook in headless Chrome, its test stories
    # pictured; and the Storybook's tests run headful, the web app in Chrome
    # and the Linux app under Xvfb, driven as apple drives the iPhone's and
    # the Mac's (tools/ci/container_build.sh headful). A release needs it.
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 120
    env:
      ISOMER_PLATFORMS: web linux
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: The tests that draw
        env:
          ISOMER_EXECUTION_LOGS: ${{ runner.temp }}/execution-logs
        run: exec tools/ci/container_build.sh headful

  apple:
    # The iPhone and Mac Storybooks' tests on GitHub's own `xcode-27` Macs,
    # four at once. Each part on a Mac of its own: the pictures
    # (tools/ci/hosted_apple_test.sh: a simulator made for the run, and the
    # Mac's own screen; 13 minutes), and the Storybook's tests headful
    # (tools/ci/hosted_headful_test.sh), driving the iPhone app (ios),
    # hosted in it (hosted) and driving the Mac app (macos). One Mac took 96
    # minutes for them all in 0.51.1's run, 64 of them Bazel building the
    # tests from cold. Two hours each: a cold build of the headful iPhone
    # tests took 44 minutes.
    needs: verify-apple
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release') }}
    strategy:
      fail-fast: false
      matrix:
        part: [pictures, ios, hosted, macos]
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        if: matrix.part == 'pictures'
        with:
          name: apple-test-apps
          path: .ci/apple
      - name: The iPhone and Mac Storybooks' tests
        if: matrix.part == 'pictures'
        run: >-
          tools/ci/hosted_apple_test.sh "$(ls .ci/apple/*storybook_ios*.ipa | head -1)"
          "$(ls .ci/apple/*storybook_macos*.zip | head -1)" .ci/platform-tests/apple
          "$(ls .ci/apple/*webview_ios*.ipa 2>/dev/null | head -1)"
      - uses: actions/download-artifact@v4
        if: matrix.part != 'pictures'
        with:
          name: headful-apps-apple
          path: .ci/headful
      - uses: actions/cache@v4
        if: matrix.part != 'pictures'
        with:
          path: ~/.cache/isomer-bazel-repository
          key: bazel-repository-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'examples/MODULE.bazel', 'examples/third_party/swift_packages/Package.resolved') }}
          restore-keys: bazel-repository-${{ runner.os }}-
      - name: The Storybook's tests, headful
        if: matrix.part != 'pictures'
        env:
          HEADFUL_APPLE_PARTS: ${{ matrix.part }}
        run: >-
          exec tools/ci/hosted_headful_test.sh apple "$(ls .ci/headful/*storybook_ios*.ipa | head -1)"
          "$(ls .ci/headful/*storybook_macos*.zip | head -1)" .ci/platform-tests/apple/headful
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: platform-tests-apple-${{ matrix.part }}
          path: .ci/platform-tests/apple
          retention-days: 14

  android:
    # The Android Storybook's tests on GitHub's own Ubuntu runner, Android 13
    # under Waydroid in a container on the runner's own kernel
    # (tools/ci/hosted_android_test.sh, tools/ci/hosted_waydroid.sh);
    # ISOMER_ANDROID_PHONE: emulator for the emulator on its KVM instead.
    needs: verify
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ISOMER_ANDROID_PHONE: waydroid
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apk
          path: .ci/android
      - name: The Android Storybook's tests
        run: tools/ci/hosted_android_test.sh .ci/android/storybook.apk .ci/platform-tests/android
      - uses: actions/download-artifact@v4
        with:
          name: headful-apps-android
          path: .ci/headful
      # Bazel's downloads kept between runs in GitHub's cache: GitHub's
      # release downloads, where most of them come from, have failed for
      # an hour at a time with 504s.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/isomer-bazel-repository
          key: bazel-repository-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'examples/MODULE.bazel', 'examples/third_party/swift_packages/Package.resolved') }}
          restore-keys: bazel-repository-${{ runner.os }}-
      - name: The Storybook's tests, headful on Android
        run: exec tools/ci/hosted_headful_test.sh android .ci/headful/storybook-x86_64.apk .ci/platform-tests/android/headful
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: platform-tests-android
          path: .ci/platform-tests/android
          retention-days: 14

  # --- By hand: the proof, built where each platform builds -------------

  proof:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'release' || inputs.run == 'proof')
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    concurrency:
      group: isomer-proof-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      PROOF_KIND: ${{ inputs.kind || 'full' }}
      ISOMER_PLATFORMS: web
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: The web app built
        run: exec tools/ci/proof.sh --stage build --platform web --kind "$PROOF_KIND" --apps "$RUNNER_TEMP/proof-apps" --review "$RUNNER_TEMP/proof-review"
      - uses: actions/upload-artifact@v4
        with:
          name: proof-apps-web
          path: ${{ runner.temp }}/proof-apps/web
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-part-build-web
          path: ${{ runner.temp }}/proof-review
          retention-days: 7

  proof-apple:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'release' || inputs.run == 'proof')
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      PROOF_KIND: ${{ inputs.kind || 'full' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: The iPhone and Mac apps built, with this Mac's Xcode
        run: exec tools/ci/proof.sh --stage build --platform ios,macos --kind "$PROOF_KIND" --apps "$RUNNER_TEMP/proof-apps" --review "$RUNNER_TEMP/proof-review"
      - uses: actions/upload-artifact@v4
        with:
          name: proof-apps-ios
          path: ${{ runner.temp }}/proof-apps/ios
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: proof-apps-macos
          path: ${{ runner.temp }}/proof-apps/macos
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-part-build-apple
          path: ${{ runner.temp }}/proof-review
          retention-days: 7

  proof-android:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'release' || inputs.run == 'proof')
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 180
    env:
      PROOF_KIND: ${{ inputs.kind || 'full' }}
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: The Android app built, for x86_64
        run: exec tools/ci/proof.sh --stage build --platform android --kind "$PROOF_KIND" --apps "$RUNNER_TEMP/proof-apps" --review "$RUNNER_TEMP/proof-review"
      - uses: actions/upload-artifact@v4
        with:
          name: proof-apps-android
          path: ${{ runner.temp }}/proof-apps/hosted/android
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-part-build-android
          path: ${{ runner.temp }}/proof-review
          retention-days: 7

  # The proof pictured on GitHub's own machines, free for a public
  # repository (tools/ci/proof.sh --stage shoot, tools/proof/proof.py
  # --here): the iPhone (a simulator made for the run) and the Mac on
  # `xcode-27` Macs, the Android Storybook under Waydroid on Ubuntu's own
  # kernel (ISOMER_ANDROID_PHONE: emulator for the emulator on its KVM), the
  # web in Ubuntu's Chrome. Each its own part, whatever came back:
  # a broken screen is what the proof is for.
  proof-shoot:
    needs: [proof, proof-apple, proof-android]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'release' || inputs.run == 'proof') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: xcode-27
          - platform: macos
            runner: xcode-27
          - platform: android
            runner: ubuntu-24.04
          - platform: web
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      ISOMER_ANDROID_PHONE: waydroid
    steps:
      - uses: actions/checkout@v5
        with:
          # A quick proof's stories include those of the story files a branch touches.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: proof-apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/apps/${{ matrix.platform == 'android' && 'hosted/android' || matrix.platform }}
      - name: The apps pictured here
        env:
          PROOF_KIND: ${{ inputs.kind || 'full' }}
        run: >-
          exec tools/ci/proof.sh --stage shoot --platform ${{ matrix.platform }} --kind "$PROOF_KIND"
          --apps "$RUNNER_TEMP/apps" --review "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-part-${{ matrix.platform }}
          path: ${{ runner.temp }}/review
          retention-days: 7

  # The parts written into the `proof` artifact Reviews reads (format 2:
  # proof.json and its files; tools/ci/proof_write.swift), whichever came
  # back (a missing platform's pictures fail it). Nothing is compared: the
  # job keeps its name, which verified.sh asks for.
  proof-compare:
    needs: [proof, proof-apple, proof-android, proof-shoot]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'release' || inputs.run == 'proof') }}
    runs-on: ubuntu-24.04-arm
    container: ghcr.io/attilathefun/visor-agent@sha256:849dcf6aeb16119e3b769b4f0c410b93ac58ed1e3b3ef2801f7534def3fbaaf0
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROOF_KIND: ${{ inputs.kind || 'full' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: proof-part-*
          path: ${{ runner.temp }}/parts
      - name: The proof
        run: exec tools/ci/proof.sh --stage compare --kind "$PROOF_KIND" --parts "$RUNNER_TEMP/parts" --proof "$RUNNER_TEMP/proof"
      # The proof's comparison with the release before's (proof-diff.json,
      # the private AttilaTheFun/reviews' docs/PROOF_FORMAT.md, "The
      # comparison: proof-diff.json"; AttilaTheFun/build_tools' proof-diff,
      # the examples' //tools/ci_tools:proof_diff), made once here and kept
      # in the proof's folder, so the artifact carries it and a release
      # attaches it beside proof.zip. Built with no token in Bazel's
      # environment, then run directly. Never fails the job.
      - uses: ./.github/actions/bazel_cache
        if: ${{ !cancelled() }}
        with:
          group: ubuntu
          disk: "false"
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: The proof's comparison
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/proof/proof.json" ] || exit 0
          cd examples
          if env -u GH_TOKEN bazel build //tools/ci_tools:proof_diff; then
            path="$(env -u GH_TOKEN bazel cquery --output=files //tools/ci_tools:proof_diff | head -1)"
            if [ -n "$path" ]; then
              "$(env -u GH_TOKEN bazel info execution_root)/$path" make "$RUNNER_TEMP/proof" ||
                echo "::warning::the proof's comparison wasn't made"
            else
              echo "::warning::the proof's comparison wasn't made: no proof-diff"
            fi
          else
            echo "::warning::the proof's comparison wasn't made: proof-diff didn't build"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90

  # --- By hand on main: a proposal (prerelease, or release once verified) -

  alpha-apple:
    # The Apple Alphas, built unsigned (alpha signs them); the version found
    # here and handed to alpha.
    needs: [verify, verify-apple, container-verify, apple, android, proof-compare]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.run == 'prerelease' || (inputs.run == 'release' &&
      needs.verify.result == 'success' &&
      needs.verify-apple.result == 'success' && needs.container-verify.result == 'success' &&
      needs.apple.result == 'success' && needs.android.result == 'success' &&
      needs.proof-compare.result == 'success'))
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      # The releases' drafts, which the version is counted from.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/stamp_apps.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: Build
        env:
          ISOMER_PLATFORMS: apple
        run: exec tools/ci/container_build.sh package .ci/packages --config=alpha $PUBLISHED_APPLE
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-apple
          path: |
            .ci/packages/*.ipa
            .ci/packages/*.zip
          retention-days: 1
          if-no-files-found: error

  alpha:
    # The proposal: Android's Alpha and the site built, every build signed
    # (build_tools' `sign`: a platform whose keys aren't set is
    # skipped, saying so), the draft made and the builds attached.
    needs: alpha-apple
    if: ${{ !cancelled() && needs.alpha-apple.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    environment: release
    timeout-minutes: 180
    permissions:
      # The draft release.
      contents: write
      # This run's proof artifact.
      actions: read
    env:
      ISOMER_PLATFORMS: android web
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
        with:
          # The draft's changes since the previous release.
          fetch-depth: 0
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - name: Version
        env:
          VERSION: ${{ needs.alpha-apple.outputs.version }}
        run: tools/ci/stamp_apps.sh "$VERSION"
      # The owner's line rule: no proposal on a line that already has a
      # published release (tools/ci/check_version_line.sh), before anything
      # is built.
      - name: The version's line is open
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.alpha-apple.outputs.version }}
        run: tools/ci/check_version_line.sh "$VERSION"
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      # exec: the runner's cancel reaches the build.
      - name: Build
        run: exec tools/ci/container_build.sh package .ci/packages --config=alpha $PUBLISHED_LINUX
      - uses: actions/download-artifact@v4
        with:
          name: alpha-apple
          path: .ci/packages
      # Nothing is published if the Mac app's icon has no dark appearance.
      - name: The icon's dark appearance
        run: tools/ci/check_mac_icons.sh .ci/packages
      # build_tools' `sign` and what it runs (the examples' //tools/ci_tools), built in a
      # step with no key in its environment (build_tools' README: Bazel's
      # server and build events see its client's environment), their paths
      # handed to the signing steps, which run `sign` directly.
      - name: The signing tools
        shell: bash
        working-directory: examples
        run: |
          bazel build //tools/ci_tools:all
          base="$(bazel info output_base)" root="$(bazel info execution_root)"
          for tool in sign rcodesign dmg java apksigner aapt2; do
            path="$(bazel cquery --output=files "//tools/ci_tools:$tool" | head -1)"
            [ -n "$path" ] || { echo "::error::no $tool"; exit 1; }
            case "$path" in external/*) path="$base/$path" ;; *) path="$root/$path" ;; esac
            echo "BUILD_TOOLS_${tool^^}=$path" >> "$GITHUB_ENV"
          done
      # The keys reach these steps alone, each its own platform's. The Apple
      # apps, named <App>-<version>-<platform>.<ext>, each line of
      # builds.json written (the Mac's icon beside it); an ad hoc profile
      # where a distribution identity is set, else development's.
      # A platform whose keys aren't set is skipped, saying so in the
      # summary.
      - name: Sign the Apple apps
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_DEVELOPMENT_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_PASSWORD }}
          APPLE_PROFILES: ${{ secrets.APPLE_PROFILES }}
        run: >-
          "$BUILD_TOOLS_SIGN" apple --key-from-env --rcodesign "$BUILD_TOOLS_RCODESIGN"
          --app Storybook --ipa-kind ad-hoc,development --skip-missing-keys
          --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/assets"
          .ci/packages/*.ipa .ci/packages/*.zip
      # Android's: its release key, its certificate pinned (ANDROID_PIN),
      # named <App>-<versionName>-android.apk; skipped, saying so in the
      # summary, when the key isn't set.
      - name: Sign the Android app
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: >-
          "$BUILD_TOOLS_SIGN" android --key-from-env --app "$ANDROID_KEY" --pin "$ANDROID_PIN"
          --java "$BUILD_TOOLS_JAVA" --apksigner "$BUILD_TOOLS_APKSIGNER" --aapt2 "$BUILD_TOOLS_AAPT2"
          --name Storybook --variant Alpha --skip-missing-keys
          --out "$RUNNER_TEMP/assets" --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA"
          .ci/packages/*.apk
      # A release's proof (this run's `proof`, Reviews' format 2), zipped
      # among the draft's assets as proof.zip: the release keeps it, and
      # Reviews compares the next release's with it.
      - uses: actions/download-artifact@v4
        if: inputs.run == 'release'
        with:
          name: proof
          path: ${{ runner.temp }}/proof
      # Its comparison (proof-diff.json) beside it when the proof job made
      # one, not in it.
      - name: The proof, among the assets
        if: inputs.run == 'release'
        run: |
          if [ -f "$RUNNER_TEMP/proof/proof-diff.json" ]; then
            mv "$RUNNER_TEMP/proof/proof-diff.json" "$RUNNER_TEMP/assets/proof-diff.json"
          fi
          tools/ci/proof_zip.sh "$RUNNER_TEMP/proof" "$RUNNER_TEMP/assets/proof.zip"
      - name: The draft release, its builds attached
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.run }}
          VERSION: ${{ needs.alpha-apple.outputs.version }}
        run: |
          tools/ci/draft_release.sh "$VERSION" "$KIND" .ci/packages/isomer-site.tar.gz
          tools/ci/attach_release.sh "v$VERSION" "$RUNNER_TEMP/assets"

  # An experiment (the private AttilaTheFun/applications' docs/EXPERIMENTS.md),
  # drafted unsigned (tools/ci/experiment_release.sh): the `release`
  # environment is main's and v* tags' alone, so a branch's experiment
  # signed would need an environment of its own.
  experiment:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.run == 'experiment' &&
      !startsWith(github.ref, 'refs/heads/release-')
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      # The draft and its assets, and the drafts the version is counted from.
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/stamp_apps.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
          disk: "false"
      - name: Build
        env:
          ISOMER_PLATFORMS: apple
        run: >-
          exec tools/ci/container_build.sh package .ci/packages --config=adhoc --config=ci_device
          --compilation_mode=opt //apple/storybook_ios_application:storybook_experiment_ios_application
      - name: Notes
        run: git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
      # build_tools' `sign` (the examples' //tools/ci_tools:sign), which
      # saves the build as built (--unsigned: no keys reach a branch's run),
      # named and described as Applications reads an experiment's (AdHoc,
      # "signed": false).
      - name: The signing tool
        shell: bash
        working-directory: examples
        run: |
          bazel build //tools/ci_tools:sign
          path="$(bazel cquery --output=files //tools/ci_tools:sign | head -1)"
          [ -n "$path" ] || { echo "::error::no sign"; exit 1; }
          echo "BUILD_TOOLS_SIGN=$(bazel info execution_root)/$path" >> "$GITHUB_ENV"
      - name: The build, saved as built
        run: >-
          "$BUILD_TOOLS_SIGN" apple --unsigned --app "Storybook Lab"
          --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/assets"
          .ci/packages/*.ipa
      - name: The experiment's draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          tools/ci/experiment_release.sh storybook-lab
          "The Storybook as an experiment: the publishing path for experiments, before the whole wasm apps"
          "$RUNNER_TEMP/assets" "$RUNNER_TEMP/notes.md"

  # --- By hand: a probe -------------------------------------------------

  waydroid-probe:
    # Whether Waydroid (Android in a container on the host's own kernel,
    # binder and all) boots on GitHub's hosted x86_64 Ubuntu, so the Android
    # GUI tests could run in the same job as everything else
    # (tools/ci/waydroid_probe.sh: the kernel, binder, Waydroid from its
    # repository, its container and a session, Android's boot and adb; the
    # findings in the run's summary). On the runner itself, not in a
    # container. Nothing depends on it, and it never fails the run.
    if: github.event_name == 'workflow_dispatch' && inputs.run == 'waydroid-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Waydroid, probed
        continue-on-error: true
        run: tools/ci/waydroid_probe.sh "$RUNNER_TEMP/waydroid-probe"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: waydroid-probe
          path: ${{ runner.temp }}/waydroid-probe
          retention-days: 1

  # --- A published release: nothing Apple rebuilt -----------------------

  release-apple:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # The release's own version (published, so listed with contents: read).
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/stamp_apps.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: apple
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: The iPhone's, for the simulator
        env:
          ISOMER_PLATFORMS: apple
        run: >-
          exec tools/ci/container_build.sh package .ci/simulator --compilation_mode=opt --ios_multi_cpus=sim_arm64
          //apple/storybook_ios_application:storybook_ios_sim_application
      - uses: actions/upload-artifact@v4
        with:
          name: release-simulator
          path: .ci/simulator
          retention-days: 1
          if-no-files-found: error

  release:
    needs: release-apple
    if: ${{ !cancelled() && needs.release-apple.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    environment: release
    timeout-minutes: 120
    permissions:
      # The release's assets.
      contents: write
      # Its commit's verify run.
      actions: read
    env:
      ISOMER_PLATFORMS: android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      # The tag's commit, with main's history beside it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The job's tools
        run: tools/ci/job_tools.sh
      # A release is a main commit: a tag whose commit isn't on main stops here.
      - name: The release is a main commit
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME's commit is not on main"; exit 1; }
      # No release of a commit not verified (its verify and proof passed, in a
      # run by hand): checked before anything is signed.
      - name: The commit was verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/verified.sh "$GITHUB_SHA"
      - name: The proposal's Alphas
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/release_alphas.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/alphas"
      # Android's build: the version of this commit's release
      # (tools/ci/version_from_tags.sh finds it by its commit).
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/stamp_apps.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) && secrets.BUILDBUDDY_API_KEY || '' }}
      - name: Android's, for production
        run: >-
          tools/ci/container_build.sh package .ci/android --config=prod --compilation_mode=opt
          //android/storybook_android_application:storybook_android_application_apk
      # build_tools' `sign` and what it runs (the examples' //tools/ci_tools), built in a
      # step with no key in its environment (build_tools' README: Bazel's
      # server and build events see its client's environment), their paths
      # handed to the signing steps, which run `sign` directly.
      - name: The signing tools
        shell: bash
        working-directory: examples
        run: |
          bazel build //tools/ci_tools:all
          base="$(bazel info output_base)" root="$(bazel info execution_root)"
          for tool in sign rcodesign dmg java apksigner aapt2; do
            path="$(bazel cquery --output=files "//tools/ci_tools:$tool" | head -1)"
            [ -n "$path" ] || { echo "::error::no $tool"; exit 1; }
            case "$path" in external/*) path="$base/$path" ;; *) path="$root/$path" ;; esac
            echo "BUILD_TOOLS_${tool^^}=$path" >> "$GITHUB_ENV"
          done
      # The keys reach these steps alone, each its own platform's. The Apple
      # apps, named <App>-<version>-<platform>.<ext>, each line of
      # builds.json written (the Mac's icon beside it); an ad hoc profile
      # where a distribution identity is set, else development's.
      # Production: each app's BuildVariant made Production as it is signed
      # again (the proposal's tested Alphas promoted), the Mac's disk image
      # beside it.
      # A key not set fails the release, never publishing it without
      # that platform's app.
      - name: Sign the Apple apps
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_DEVELOPMENT_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_PASSWORD }}
          APPLE_PROFILES: ${{ secrets.APPLE_PROFILES }}
        run: >-
          "$BUILD_TOOLS_SIGN" apple --key-from-env --rcodesign "$BUILD_TOOLS_RCODESIGN"
          --app Storybook --ipa-kind ad-hoc,development
          --variant Production --dmg "$BUILD_TOOLS_DMG"
          --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/assets"
          "$RUNNER_TEMP"/alphas/*
      # Android's: its release key, its certificate pinned (ANDROID_PIN),
      # named <App>-<versionName>-android.apk; a key not set fails the release.
      - name: Sign the Android app
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: >-
          "$BUILD_TOOLS_SIGN" android --key-from-env --app "$ANDROID_KEY" --pin "$ANDROID_PIN"
          --java "$BUILD_TOOLS_JAVA" --apksigner "$BUILD_TOOLS_APKSIGNER" --aapt2 "$BUILD_TOOLS_AAPT2"
          --name Storybook --variant Production
          --out "$RUNNER_TEMP/assets" --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA"
          .ci/android/*.apk
      - name: The signed builds, attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/attach_release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/assets"
      - uses: actions/download-artifact@v4
        with:
          name: release-simulator
          path: .ci/simulator
      - name: The release's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/release_extras.sh upload "$GITHUB_REF_NAME" .ci/simulator
