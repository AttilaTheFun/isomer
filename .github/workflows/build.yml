# Isomer's CI, by the owner's policy for protected repositories
# (AttilaTheFun/reviews' docs/CI_POLICY.md) and the shape the owner set on
# 2026-11-08: the tests without a GUI before a merge, every build after
# one, the GUI tests and the proof by hand to propose a release, on
# GitHub's own runners. No slot of Shireworks' primary VM: those are for
# private repositories' GUI tests.
#
# - container (every pull request from a branch of this repository: a
#   self-hosted runner never runs a fork's code): every platform's
#   Storybook built in one Linux container on Shireworks' on-demand runners
#   (tools/ci/container_build.sh pr: the Apple ones with rules_applecross),
#   then every test without a GUI: the core's, the web's in headless Chrome,
#   the Storybook's headless UI tests and the remote-driving tests. It reads
#   Shireworks' Bazel cache, never writes it, and leases nothing. The
#   required check. A newer push cancels its run.
# - populate (each commit on main): the merged tree built (container_build.sh
#   all), and what a release builds (the published apps as alpha builds
#   them, the proof's apps): the one job that writes Shireworks' Bazel cache
#   (Shireworks' ci.populate names it), so a later pull request's build, and
#   a release's, is mostly hits.
# - By hand (workflow_dispatch, `run:`):
#   - verify: the GUI tests: everything built in the container, then the
#     Storybook's test stories on GitHub's own runners (apple: the iPhone's
#     simulator and the Mac on `xcode-27`; android: an emulator under
#     Ubuntu's KVM; windows: windows-11-arm, tier 2, not waited for; a
#     private copy on Shireworks' leases instead); and beside them the
#     proof: the Storybook on every tier-1 platform, built in CI's
#     container, pictured on GitHub's own machines (a private copy's on
#     Shireworks'), written in Reviews' format 2 (each picture an item under
#     a stable id; Reviews compares it with the previous release's, not
#     CI), uploaded as the `proof` artifact and attached to a release's
#     draft as proof.zip (proof, proof-shoot, proof-compare; tools/ci/proof.sh). The full set by default; `kind:
#     quick` the core set. On a commit of main, or, to bisect a regression,
#     on a branch pushed at an earlier one;
#   - prerelease (main): alpha alone: its version asked of Applications
#     Server, the Storybook built for the iPhone and iPad (.ipa), the Mac
#     (.zip) and Android (.apk) as Alphas and the web site packaged, the Mac
#     app's icon checked, published (the server signs the Apple ones, and
#     notarizes the Mac's) and attached to a draft release marked
#     pre-release (tools/ci/draft_release.sh, attach_release.sh). No tests;
#   - release (main): verify and the proof, then, only once they pass,
#     alpha, and a draft release proposed for release, naming this run;
#   - adhoc (a branch other than main or a release branch): the apps built
#     as an AdHoc build and published, how a pull request's build reaches a
#     phone.
#   Drafts are CI's: no agent publishes one or makes a tag.
# - release (the owner publishes a proposed release in Reviews, which makes
#   its v* tag): its commit checked to be main's and verified
#   (tools/ci/verified.sh), its iPhone's and Mac's Alphas promoted to
#   production by the server (nothing Apple rebuilt), Android's built for
#   production and published, and the release given its assets: the proof,
#   the Mac app's disk image, the Android app and the iPhone app for the
#   simulator. A pre-release is never released so.
# The Playground was isomer's until 0.47; it is AttilaTheFun/playground's,
# with CI of the same shape.
# No signing key, notary key or password here: the publishing jobs' OIDC
# token says where their builds came from, and which commit's version they
# are given (the private AttilaTheFun/applications' docs/CI.md).
name: Build
on:
  push:
    # main's commits: populate.
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run:
        description: "What to run: verify, prerelease or release on main (verify on a branch to bisect); adhoc on another branch"
        type: choice
        options: [verify, prerelease, release, adhoc]
        default: verify
      kind:
        description: The proof's kind
        type: choice
        options: [full, quick]
        default: full
# A pull request's newer push (a rebase, an update with main) cancels its
# branch's older run, whose result no longer counts. Every other run
# (populate, a run by hand, a release) is a group of its own and never
# cancelled, so a publish is never cut off halfway.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.head_ref) || format('build-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# What the publishing jobs build, each with its own --config: the
# Storybook's iPhone and iPad app (a device build, signed ad hoc with a
# placeholder profile by --config=ci_device, which the server signs again
# with the bundle id's own), Mac app and Android app (its android_binary,
# whose signed .apk is published), optimized, as they ship, and the web
# site (isomer-site.tar.gz, which the release carries and pages.yml
# deploys). Flags as --name=value (tools/ci/container_build.sh package).
env:
  PUBLISHED_APPS: >-
    --config=ci_device --compilation_mode=opt
    //apple/storybook_ios_application:storybook_ios_application
    //apple/storybook_macos_application:storybook_macos_application
    //android/storybook_android_application:storybook_android_application_apk
    //web/storybook_web_application:isomer_site

jobs:
  container:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, isomer-jit]
    timeout-minutes: 180
    env:
      # The Android test APK for x86_64 too, as verify builds it.
      ISOMER_ANDROID_X86_64: ${{ !github.event.repository.private && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      # Every target built in the Linux container (Windows on Arm with
      # --config=windows_on_linux), then every test that runs without a GUI:
      # the core's, the web's in headless Chrome, the headless UI tests.
      - name: Every target built, and the tests without a GUI
        env:
          ISOMER_EXECUTION_LOGS: ${{ runner.temp }}/execution-logs
        run: exec tools/ci/container_build.sh pr
      # What each invocation ran, to find what the cache misses.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: execution-logs
          path: ${{ runner.temp }}/execution-logs
          retention-days: 7

  populate:
    # Each commit on main: the merged tree built as container builds it,
    # nothing run or published. Shireworks grants this job alone the cache's
    # write (its ci.populate).
    if: github.event_name == 'push'
    runs-on: [self-hosted, isomer-jit]
    timeout-minutes: 180
    env:
      ISOMER_ANDROID_X86_64: ${{ !github.event.repository.private && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: The merged tree, built into the cache
        env:
          ISOMER_EXECUTION_LOGS: ${{ runner.temp }}/execution-logs
        run: exec tools/ci/container_build.sh all
      # What a release builds, built here too, so its jobs find their actions
      # in the cache: the published apps as alpha builds them (unstamped:
      # only what the version reaches differs), and the proof's apps.
      - name: The published apps, built into the cache
        run: exec tools/ci/container_build.sh package .ci/packages --config=alpha $PUBLISHED_APPS
      - name: The proof's apps, built into the cache
        run: exec tools/ci/proof.sh --stage prebuild --apps "$RUNNER_TEMP/proof-apps" --review "$RUNNER_TEMP/proof-review"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: execution-logs
          path: ${{ runner.temp }}/execution-logs
          retention-days: 7

  verify:
    # By hand: every platform built, and the container's own tests; a public
    # repository's iPhone, Mac and Android tests then run on GitHub's own
    # runners (apple, android, below), a private copy's here on Shireworks'
    # leases. The proof runs beside it (proof, proof-shoot, proof-compare).
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: [self-hosted, isomer-jit]
    timeout-minutes: 180
    env:
      PLATFORM_TESTS: ${{ github.event.repository.private && 'android apple' || '' }}
      # A public repository's Android tests run on GitHub's own Ubuntu
      # runner (android, below), from an x86_64 test APK built here.
      ISOMER_ANDROID_X86_64: ${{ !github.event.repository.private && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      # Every platform built in the Linux container, and the tests that run
      # there: the core's, the web Storybook in headless Chrome.
      - name: Build, and the tests in the build container
        run: exec tools/ci/container_build.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: android-test-apk
          path: .ci/platforms/android-x86_64
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: windows-test-app
          path: .ci/platforms/windows
          retention-days: 3
      # The same apps with their drivers built in, for the Storybook's tests
      # run headful (tools/ci/hosted_headful_test.sh).
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: headful-apps
          path: .ci/platforms/headful
          retention-days: 3
      # The Windows Storybook headful with its tests, built for Windows here.
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: windows-headful
          path: .ci/platforms/windows-headful
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: apple-test-apps
          path: |
            .ci/platforms/*storybook_ios*.ipa
            .ci/platforms/*storybook_macos*.zip
          retention-days: 3
      # exec: the runner's cancel reaches the script, which releases its leases.
      - name: The tests on Shireworks' leases
        if: github.event.repository.private
        run: exec tools/ci/platform_tests.sh .ci/platform-tests
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: platform-tests
          path: .ci/platform-tests
          retention-days: 14

  apple:
    # The iPhone and Mac Storybooks' tests on GitHub's own `xcode-27` Mac (a
    # simulator made for the run, and the Mac's own screen:
    # tools/ci/hosted_apple_test.sh), for a public repository's verify; a
    # private one runs them in verify itself, on Shireworks' leases. Two
    # hours: its builds (the headful iPhone app, the tests hosted in it, the
    # Mac's) took 85 minutes of 0.50's run where Bazel's cache was cold, and
    # the Mac's tests were cut off at 90.
    needs: verify
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release') && !github.event.repository.private }}
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apple-test-apps
          path: .ci/apple
      - name: The iPhone and Mac Storybooks' tests
        run: >-
          tools/ci/hosted_apple_test.sh "$(ls .ci/apple/*storybook_ios*.ipa | head -1)"
          "$(ls .ci/apple/*storybook_macos*.zip | head -1)" .ci/platform-tests/apple
      - uses: actions/download-artifact@v4
        with:
          name: headful-apps
          path: .ci/headful
      # Bazel's downloads kept between runs in GitHub's cache: GitHub's
      # release downloads, where most of them come from, have failed for
      # an hour at a time with 504s.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/isomer-bazel-repository
          key: bazel-repository-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'examples/MODULE.bazel', 'examples/third_party/swift_packages/Package.resolved') }}
          restore-keys: bazel-repository-${{ runner.os }}-
      # The Storybook's tests (the headless source) against the apps headful:
      # the test built here, the apps the container's.
      - name: The Storybook's tests, headful on the iPhone and the Mac
        run: >-
          exec tools/ci/hosted_headful_test.sh apple "$(ls .ci/headful/*storybook_ios*.ipa | head -1)"
          "$(ls .ci/headful/*storybook_macos*.zip | head -1)" .ci/platform-tests/apple/headful
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: platform-tests-apple
          path: .ci/platform-tests/apple
          retention-days: 14

  windows:
    # The Windows Storybook's tests on GitHub's own windows-11-arm runner, run
    # natively (tools/ci/hosted_windows_test.ps1), for a public repository's
    # verify. Windows is tier 2: its result is reported, and a release
    # doesn't wait for it.
    needs: verify
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release') && !github.event.repository.private }}
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-test-app
          path: .ci/windows
      - name: The Windows Storybook's tests
        shell: pwsh
        run: tools/ci/hosted_windows_test.ps1 .ci/windows .ci/platform-tests/windows
      - uses: actions/download-artifact@v4
        with:
          name: windows-headful
          path: .ci/windows-headful
      # The Storybook's tests (the headless source) against the app headful,
      # both built in the container, run here in Git's bash.
      - name: The Storybook's tests, headful on Windows
        shell: bash
        run: exec tools/ci/hosted_headful_test.sh windows .ci/windows-headful .ci/platform-tests/windows/headful
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: platform-tests-windows
          path: .ci/platform-tests/windows
          retention-days: 14

  android:
    # The Android Storybook's tests on GitHub's own Ubuntu runner, the
    # emulator on its KVM (tools/ci/hosted_android_test.sh), for a public
    # repository's verify; a private one runs them in verify itself, on a
    # Shireworks emulator.
    needs: verify
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release') && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apk
          path: .ci/android
      - name: The Android Storybook's tests
        run: tools/ci/hosted_android_test.sh .ci/android/storybook.apk .ci/platform-tests/android
      - uses: actions/download-artifact@v4
        with:
          name: headful-apps
          path: .ci/headful
      # Bazel's downloads kept between runs in GitHub's cache: GitHub's
      # release downloads, where most of them come from, have failed for
      # an hour at a time with 504s.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/isomer-bazel-repository
          key: bazel-repository-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'examples/MODULE.bazel', 'examples/third_party/swift_packages/Package.resolved') }}
          restore-keys: bazel-repository-${{ runner.os }}-
      - name: The Storybook's tests, headful on Android
        run: exec tools/ci/hosted_headful_test.sh android .ci/headful/storybook-x86_64.apk .ci/platform-tests/android/headful
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: platform-tests-android
          path: .ci/platform-tests/android
          retention-days: 14

  proof:
    # By hand, with verify: never a pull request's or a push's.
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    # Shireworks' single-use Linux containers, as the build's: the apps built
    # in it (rules_applecross for the Apple ones). A public repository's are
    # then pictured on GitHub's own machines (the proof-* jobs below). A
    # private copy pictures everything here, on machines it leases, the web
    # in Chrome for Testing in this container.
    runs-on: [self-hosted, isomer-jit]
    concurrency:
      group: isomer-proof-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      # The branch, for a pull request's head (its run's ref is GitHub's merge).
      PROOF_REF: ${{ github.event.pull_request && format('refs/heads/{0}', github.head_ref) || github.ref }}
      PROOF_KIND: ${{ inputs.kind || 'full' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request's own head, not GitHub's merge of it: the commit
          # its proof is of. The whole history: a quick proof's stories
          # include those of the story files a branch touches.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: The apps on every platform, pictured, and the proof
        if: github.event.repository.private
        # exec: the runner's cancel reaches the script's trap, which releases its leases.
        run: exec tools/ci/proof.sh --kind "$PROOF_KIND" --proof "$RUNNER_TEMP/proof"
      # The proof whether every picture came or not: a broken screen is what it's for.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event.repository.private }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90
      - name: The apps built
        if: ${{ !github.event.repository.private }}
        run: exec tools/ci/proof.sh --stage build --kind "$PROOF_KIND" --apps "$RUNNER_TEMP/proof-apps" --review "$RUNNER_TEMP/proof-review"
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: proof-apps-ios
          path: ${{ runner.temp }}/proof-apps/ios
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: proof-apps-macos
          path: ${{ runner.temp }}/proof-apps/macos
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: proof-apps-android
          path: ${{ runner.temp }}/proof-apps/hosted/android
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          name: proof-apps-web
          path: ${{ runner.temp }}/proof-apps/web
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !github.event.repository.private }}
        with:
          name: proof-part-build
          path: ${{ runner.temp }}/proof-review
          retention-days: 7

  # A public repository's proof, pictured on GitHub's own machines, free
  # for one (tools/ci/proof.sh --stage shoot, tools/proof/proof.py --here):
  # the iPhone (a simulator made for the run) and the Mac on `xcode-27`
  # Macs, the Android Storybook on an emulator under Ubuntu's KVM, the web
  # in Ubuntu's Chrome. Each its own part, whatever came back: a broken
  # screen is what the proof is for.
  proof-shoot:
    needs: proof
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: xcode-27
          - platform: macos
            runner: xcode-27
          - platform: android
            runner: ubuntu-24.04
          - platform: web
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # A quick proof's stories include those of the story files a branch touches.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: proof-apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/apps/${{ matrix.platform == 'android' && 'hosted/android' || matrix.platform }}
      - name: The apps pictured here
        env:
          PROOF_KIND: ${{ inputs.kind || 'full' }}
        run: >-
          exec tools/ci/proof.sh --stage shoot --platform ${{ matrix.platform }} --kind "$PROOF_KIND"
          --apps "$RUNNER_TEMP/apps" --review "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-part-${{ matrix.platform }}
          path: ${{ runner.temp }}/review
          retention-days: 7

  # The parts written into the `proof` artifact Reviews reads (format 2:
  # proof.json and its files; tools/ci/proof_write.swift), whichever came
  # back (a missing platform's pictures fail it). Nothing is compared: the
  # job keeps its name, which verified.sh asks for.
  proof-compare:
    needs: [proof, proof-shoot]
    if: ${{ !cancelled() && !github.event.repository.private && needs.proof.result == 'success' }}
    runs-on: [self-hosted, isomer-jit]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROOF_REF: ${{ github.event.pull_request && format('refs/heads/{0}', github.head_ref) || github.ref }}
      PROOF_KIND: ${{ inputs.kind || 'full' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: proof-part-*
          path: ${{ runner.temp }}/parts
      - name: The proof
        run: exec tools/ci/proof.sh --stage compare --kind "$PROOF_KIND" --parts "$RUNNER_TEMP/parts" --proof "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90

  alpha:
    # A proposal, by hand on main: prerelease alone, or release once verify
    # (and a public repository's Android tests) and the proof have passed.
    # In CI's Linux container, as every job but the GUI tests: its version
    # asked of Applications Server, stamped in (tools/ci/stamp_apps.sh), the
    # apps built (tools/ci/container_build.sh package), the Mac app's icon
    # checked for the dark appearance (tools/ci/check_mac_icons.sh), the
    # apps published (tools/ci/publish_from_ci.sh: the server signs the Apple
    # ones and notarizes the Mac's), and the draft release made with the web
    # site (tools/ci/draft_release.sh), the builds as the server signed them
    # attached to it (tools/ci/attach_release.sh: <App>-<version>-<platform>.<ext>
    # and builds.json, which Applications lists, the private
    # AttilaTheFun/applications' docs/RELEASE_ASSETS.md).
    needs: [verify, apple, android, proof, proof-compare]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.run == 'prerelease' || (inputs.run == 'release' && needs.verify.result == 'success' &&
      (github.event.repository.private ||
      (needs.apple.result == 'success' && needs.android.result == 'success' && needs.proof-compare.result == 'success')) &&
      (!github.event.repository.private || needs.proof.result == 'success')))
    runs-on: [self-hosted, isomer-jit]
    timeout-minutes: 180
    permissions:
      # The draft release.
      contents: write
      # The OIDC token Applications Server checks.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The draft's changes since the previous release.
          fetch-depth: 0
      # The builds' version, MAJOR.MINOR.N: the next of the committed line
      # for the token's commit, from Applications Server (the same again for
      # the same commit), stamped into the checkout before the build and
      # never committed.
      - name: Version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/stamp_apps.sh
      # The owner's line rule: no proposal on a line that already has a
      # published release (tools/ci/check_version_line.sh), before anything
      # is built.
      - name: The version's line is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          tools/ci/check_version_line.sh
          "$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' examples/apple/storybook_ios_application/Info.plist)"
      # exec: the runner's cancel reaches the build.
      - name: Build
        run: exec tools/ci/container_build.sh package .ci/packages --config=alpha $PUBLISHED_APPS
      # Nothing is published if the Mac app's icon has no dark appearance.
      - name: The icon's dark appearance
        run: tools/ci/check_mac_icons.sh .ci/packages
      - name: Notes
        run: git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: >-
          tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" --download "$RUNNER_TEMP/assets"
          .ci/packages/*.zip .ci/packages/*.ipa .ci/packages/*.apk
      # A release's proof (this run's `proof`, Reviews' format 2), zipped
      # among the draft's assets as proof.zip: the release keeps it, and
      # Reviews compares the next release's with it.
      - uses: actions/download-artifact@v4
        if: inputs.run == 'release'
        with:
          name: proof
          path: ${{ runner.temp }}/proof
      - name: The proof, among the assets
        if: inputs.run == 'release'
        run: tools/ci/proof_zip.sh "$RUNNER_TEMP/proof" "$RUNNER_TEMP/assets/proof.zip"
      - name: The draft release, its builds attached
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.run }}
        run: |
          version="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' examples/apple/storybook_ios_application/Info.plist)"
          tools/ci/draft_release.sh "$version" "$KIND" .ci/packages/isomer-site.tar.gz
          tools/ci/attach_release.sh "v$version" "$RUNNER_TEMP/assets"

  # AdHoc: a branch built by hand (workflow_dispatch with run: adhoc, on a
  # branch that is neither main nor a release branch), the apps built as
  # alpha's are with --config=adhoc and published; the server takes them as
  # AdHoc builds, kept a week, never attached to a release. The build
  # itself stops a tree that doesn't build.
  adhoc:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.run == 'adhoc' &&
      github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release-')
    runs-on: [self-hosted, isomer-jit]
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/stamp_apps.sh
      - name: Build
        run: exec tools/ci/container_build.sh package .ci/packages --config=adhoc $PUBLISHED_APPS
      - name: The icon's dark appearance
        run: tools/ci/check_mac_icons.sh .ci/packages
      # The branch's commit's message, from git: a run by hand has no
      # head_commit in its event.
      - name: Notes
        run: git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" .ci/packages/*.zip .ci/packages/*.ipa .ci/packages/*.apk

  # A release: when the owner publishes a GitHub release (its v0.40.N tag on
  # a main commit, whose proof is in). Nothing Apple is rebuilt: the
  # iPhone's and the Mac's Alphas main's CI published of that commit (the
  # builds the owner tested) are promoted by Applications Server, stamped
  # Production and signed again (tools/ci/promote_from_ci.sh). Android's
  # are built for production and published, the server signing none. Each
  # is attached to the release as Applications reads it, replacing the
  # Alphas of the same names, with the Mac app's disk image
  # (tools/ci/attach_release.sh); then its proof and the iPhone app for the
  # simulator (tools/ci/release_extras.sh).
  release:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: [self-hosted, isomer-jit]
    timeout-minutes: 120
    permissions:
      # The release's assets.
      contents: write
      # Its commit's proof artifact.
      actions: read
      # The OIDC token Applications Server checks: a v* tag's, by a releaser.
      id-token: write
    steps:
      # The tag's commit, with main's history beside it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A release is a main commit: a tag whose commit isn't on main stops here.
      - name: The release is a main commit
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME's commit is not on main"; exit 1; }
      # No release of a commit not verified (its verify and proof passed, in a
      # run by hand): checked before anything is promoted.
      - name: The commit was verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/verified.sh "$GITHUB_SHA"
      # Untrusted text reaches the shell through env, never ${{ }} in run.
      - name: Notes
        env:
          BODY: ${{ github.event.release.body }}
        run: printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"
      - name: The iPhone's and the Mac's, promoted
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/promote_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" --download "$RUNNER_TEMP/assets"
      # Android's and the simulator's builds: the version main's Alpha of
      # the commit was (the server's answer for the token's commit).
      - name: Version
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/stamp_apps.sh
      - name: Android's, for production
        run: >-
          tools/ci/container_build.sh package .ci/android --config=prod --compilation_mode=opt
          //android/storybook_android_application:storybook_android_application_apk
      - name: Android's, published
        env:
          APPLICATIONS_CI_CODE: ${{ secrets.APPLICATIONS_CI_CODE }}
        run: tools/ci/publish_from_ci.sh --notes-file "$RUNNER_TEMP/notes.md" --download "$RUNNER_TEMP/assets" .ci/android/*.apk
      - name: The signed builds, attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/attach_release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/assets"
      - name: The iPhone's, for the simulator
        run: >-
          tools/ci/container_build.sh package .ci/simulator --compilation_mode=opt --ios_multi_cpus=sim_arm64
          //apple/storybook_ios_application:storybook_ios_sim_application
      - name: The release's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/release_extras.sh upload "$GITHUB_REF_NAME" .ci/simulator
