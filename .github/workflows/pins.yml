# Whether every dependency of main's commit is pinned to a released version
# (tools/released_pins.sh): SwiftPM packages by version, Bazel modules from
# a registry. A pull request may still pin a revision while what it needs is
# in development; a release may not, and Reviews holds a release until its
# commit's `pins` check passes.
#
# The script is sh, git, grep and awk: on GitHub's own runner for this
# public repository, on OS Server's single-use Linux containers for a
# private copy.
name: Pins
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pins:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "isomer-jit"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: tools/released_pins.sh
