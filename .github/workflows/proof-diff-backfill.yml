# The one-off backfill of proof-diff.json (docs/PROOF_FORMAT.md, "Releases
# made before it"): every published release with a proof.zip and no
# proof-diff.json gets its comparison with the release before it, made by
# AttilaTheFun/build_tools' proof-diff (the examples'
# //tools/ci_tools:proof_diff) and uploaded beside its proof.zip. By hand only,
# with the job's own token (contents: write), never one copied by hand.
# A dry run (the default) makes each manifest and says its counts, and
# uploads nothing.
name: Proof diff backfill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make and count each manifest, upload nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    timeout-minutes: 60
    env:
      ISOMER_PLATFORMS: none
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          disk: "false"
      # proof-diff built with no token in Bazel's environment, its path
      # handed to the next step, which runs it directly.
      - name: proof-diff
        shell: bash
        working-directory: examples
        run: |
          bazel build //tools/ci_tools:proof_diff
          path="$(bazel cquery --output=files //tools/ci_tools:proof_diff | head -1)"
          [ -n "$path" ] || { echo "::error::no proof-diff"; exit 1; }
          echo "PROOF_DIFF=$(bazel info execution_root)/$path" >> "$GITHUB_ENV"
      - name: The releases' comparisons
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            "$PROOF_DIFF" backfill --dry-run
          else
            "$PROOF_DIFF" backfill
          fi
