# Bazel's caches for a CI job, from GitHub's cache (actions/cache), and its
# settings (tools/ci/ci_bazel.sh setup): the repository cache (downloads)
# and the disk cache (actions' outputs) of the job's group, linux, android or
# apple (where it builds, so what it caches is of use to it), keyed by
# MODULE.bazel and the SwiftPM graphs, the disk cache by commit too, the
# newest of the group's restored when this commit's isn't there. Only main's
# builds write them (.github/actions/bazel_cache_save); every other job reads them.
name: Bazel's cache
description: Restores the job group's Bazel caches and writes Bazel's settings
inputs:
  group:
    description: linux, android or apple
    required: true
  disk:
    description: Whether to restore the disk cache too ("false" for the repository cache alone)
    default: "true"
outputs:
  repository-hit:
    description: Whether the repository cache's own key was found
    value: ${{ steps.repository.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: repository
      uses: actions/cache/restore@v4
      with:
        path: .ci/bazel-cache/repository
        key: bazel-repository-${{ inputs.group }}-${{ hashFiles('MODULE.bazel', 'examples/MODULE.bazel', '**/Package.resolved') }}
        restore-keys: bazel-repository-${{ inputs.group }}-
    - if: inputs.disk != 'false'
      uses: actions/cache/restore@v4
      with:
        path: .ci/bazel-cache/disk
        key: bazel-disk-${{ inputs.group }}-${{ hashFiles('MODULE.bazel', 'examples/MODULE.bazel', '**/Package.resolved') }}-${{ github.sha }}
        restore-keys: |
          bazel-disk-${{ inputs.group }}-${{ hashFiles('MODULE.bazel', 'examples/MODULE.bazel', '**/Package.resolved') }}-
          bazel-disk-${{ inputs.group }}-
    - name: Bazel's settings
      shell: bash
      run: tools/ci/ci_bazel.sh setup .ci/bazel-cache
