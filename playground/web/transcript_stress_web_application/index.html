<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Transcript Stress</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: light-dark(#fff, #000); }
    #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="./runtime/react.production.min.js"></script>
  <script src="./runtime/react-dom.production.min.js"></script>
  <script type="module">
    import { boot } from "./runtime/boot.js";
    // Visor's web client's settings: the React renderer, the page itself
    // scrolling (documentScroll).
    await boot({ canvas: document.getElementById("canvas"), wasmURL: "./app.wasm", rendererName: "react", dependencies: {}, documentScroll: true });
    // ?stream: press the Stream pill once the transcript is up.
    if (new URLSearchParams(location.search).has("stream")) {
      const press = () => {
        const pill = [...document.querySelectorAll("[data-tap]")].find((e) => e.textContent.trim() === "Stream");
        if (pill) pill.click(); else setTimeout(press, 250);
      };
      press();
    }
  </script>
</body>
</html>
