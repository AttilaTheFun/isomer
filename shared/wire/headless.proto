// The headless host's driver protocol (0.45): a test, an agent or a person
// drives an app built headless (headless/libraries/swift_ui) by what it
// shows, one command and its answer at a time, never pixels.
//
// Two encodings of the same messages: newline-delimited JSON (protobuf's JSON
// mapping, `{"cmd": "tap", "target": "Send"}` a line), the host's default,
// for a terminal; and length-delimited binary (a varint length, then the
// message) with ISO_HEADLESS_PROTOCOL=binary, IsomerHeadless's.

syntax = "proto3";

package isomer.wire;

option swift_prefix = "Wire_";
option java_package = "dev.isomer.wire";
option java_multiple_files = true;

message Command {
  // ls, info, inspect, tap, type, set, select, swipe, back, dismiss, wait or
  // quit (drive/driver/IsomerAppDriver.swift says each).
  string cmd = 1;
  // The element: its name on the screen (`button-3`, `text-2`: its role and
  // its place among that role's, from 1), its accessibility identifier, its
  // label, or the last whose label holds it. A text taps or inspects as
  // itself; `tap` on a text taps the button holding it.
  string target = 2;
  // `type`'s text; `wait`'s text to wait for.
  string text = 3;
  // `set`'s value (a toggle's "1" or "0", a picker's index); `select`'s
  // option, by its label.
  string value = 4;
  // `wait`'s timeout in seconds (5 when 0).
  double timeout = 5;
  // `swipe`'s direction: up, down, left or right.
  string direction = 6;
}

message Answer {
  // Always set, so the JSON shows `"ok": false` too.
  optional bool ok = 1;
  optional string error = 2;
  // The screen once the UI settled after the command.
  Screen screen = 3;
  // What the app is: `info`'s answer, and the first message an app that
  // dials out sends (session_service.proto's Driver.Attach).
  Info info = 4;
  // `inspect`'s answer: one element or text in full.
  Inspection inspection = 5;
  // A hub's answer to `apps`: the apps attached to it, each under the name
  // it is driven by.
  repeated Attachment apps = 6;
}

// An app attached to a hub: the name it is driven by (`iso-target`) and what
// it said it is when it attached.
message Attachment {
  string name = 1;
  Info info = 2;
}

message Info {
  // The app's name and bundle identifier.
  string name = 1;
  string bundle_identifier = 2;
  string version = 3;
  // Headless, Android, Web, iOS, macOS, Linux or Windows.
  string platform = 4;
  // The renderer drawing it (None headless, React, Compose, SwiftUI, …).
  string renderer = 5;
  // The window, in points.
  double width = 6;
  double height = 7;
}

message Screen {
  // Every text shown.
  repeated string texts = 1;
  // What can be used: buttons, text fields, controls.
  repeated Element elements = 2;
  // What is presented (sheets, popovers, alerts), the topmost last.
  repeated Presentation presented = 3;
}

message Element {
  // button, textField, toggle, picker, segmented, stepper, slider,
  // datepicker or colorpicker.
  string role = 1;
  string label = 2;
  // Its `accessibilityIdentifier`.
  optional string id = 3;
  optional string value = 4;
  // A picker's or a segmented control's options, by label.
  repeated string options = 5;
  // Its name on this screen: its role and its place among that role's, from
  // 1 (`button-3`). A text's is `text-<n>`, its place in Screen.texts.
  string name = 6;
}

// An element or a text as the app's tree has it: what `inspect` answers.
message Inspection {
  // Its name on the screen (`button-3`, `text-2`) and its role.
  string name = 1;
  string role = 2;
  string label = 3;
  optional string id = 4;
  optional string value = 5;
  repeated string options = 6;
  // The texts inside it, in order.
  repeated string texts = 7;
  // What the tree has it as: text, box, stack, textField, slider, a host
  // view's kind (toggle, picker, navstack…).
  string kind = 8;
  // What it does with input: tap, edit, drag.
  repeated string actions = 9;
  // Its node's parameters: accessibility (a11yLabel, a11yValue, a11yHint…),
  // a control's title and style, disabled, and what its host reads.
  map<string, string> params = 10;
  // A text's font size and weight, its colour (#rrggbbaa), its line limit.
  optional double font_size = 11;
  optional int32 font_weight = 12;
  optional string color = 13;
  optional int32 lines = 14;
  // The element it is in (a text in a button: the button's name).
  optional string container = 15;
}

message Presentation {
  // sheet, popover or alert.
  string style = 1;
  string title = 2;
  string message = 3;
}
