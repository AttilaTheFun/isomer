// The remote session (session.proto) and the driver (headless.proto) as gRPC
// services, the transport an Isomer app is driven over remotely (gRPC Swift 2
// over HTTP/2). The same messages also go over a WebSocket, standard input
// and output, a Unix socket or a call in the same process (drive/: the
// IsomerServer protocol and its adapters).
//
// An app built headless serves Session and Headless itself. A headful app
// dials out to a test host (or a CLI's hub) and serves Driver.Attach's
// commands over the connection it opened. A stream ends when either side
// ends it. A call to a remote app carries `authorization: Bearer <token>`.

syntax = "proto3";

package isomer.wire;

import "headless.proto";
import "session.proto";
import "layout.proto";

option swift_prefix = "Wire_";
option java_package = "dev.isomer.wire";
option java_multiple_files = true;

service Session {
  rpc Connect(stream ClientMessage) returns (stream ServerMessage);
}

service Headless {
  rpc Drive(stream Command) returns (stream Answer);
}

// A headful app driven over a connection it opened: the host sends the
// commands, the app the answers, its first one carrying `info` (who it is).
service Driver {
  rpc Attach(stream Answer) returns (stream Command);
}

// The headless head's layout, for tests (layout.proto): served by an app
// built headless, never by the CLI's hub (the CLI drives without frames).
service Layout {
  rpc Frames(stream LayoutRequest) returns (stream Layout);
}
