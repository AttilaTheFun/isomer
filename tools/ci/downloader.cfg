# Bazel's downloader in CI (--downloader_config; tools/ci/ci_bazel.sh adds
# the job's own lines after these). A URL matching a rewrite is replaced by
# every rewrite's result, tried in this order, the first that answers with
# the file's checksum taken: a 404 or a 5xx moves on to the next.
#
# GitHub's downloads at GitHub, then at Bazel's mirror (GitHub's release
# downloads have failed with 504s for hours).
rewrite (github\.com/.*) $1
rewrite (github\.com/.*) mirror.bazel.build/$1
# Maven Central at Central, then at Google's mirror of it (Gradle's
# GOOGLE mirror). Central has answered 404 for artifacts it holds (picocli
# 4.7.4, kotlinx-coroutines 1.9.0, slf4j-api 1.7.30, gson 2.8.9, from
# repo1.maven.org and repo.maven.apache.org alike: one CDN), and Bazel
# takes a 404 as final for that URL. Every Maven artifact is pinned by its
# SHA-256 (rules_jvm_external's lock files), so a mirror can't change one.
rewrite (repo1\.maven\.org/maven2/.*) $1
rewrite repo1\.maven\.org/maven2/(.*) maven-central.storage-download.googleapis.com/maven2/$1
rewrite (repo\.maven\.apache\.org/maven2/.*) $1
rewrite repo\.maven\.apache\.org/maven2/(.*) maven-central.storage-download.googleapis.com/maven2/$1
