<!DOCTYPE html>
<!-- The web form of the SwiftProtobuf greeter: the SAME wasm32 binary the
     other platforms embed, run in the BROWSER as a WASI command with a
     minimal inline preview1 shim (the same surface swift_ffi's TS host and
     the native benches stub). The greeter line lands in #out and on the
     console. -->
<html>
<head><meta charset="utf-8"><title>proto_greeter (web)</title></head>
<body>
<pre id="out">running…</pre>
<script>
(async () => {
  const out = document.getElementById("out");
  const lines = [];
  let memory = null;
  const text = new TextDecoder();

  // Minimal WASI preview1: enough for a Swift command reactor's stdio path.
  const wasi = {
    args_sizes_get: (argc, argvBufSize) => {
      new DataView(memory.buffer).setUint32(argc, 0, true);
      new DataView(memory.buffer).setUint32(argvBufSize, 0, true);
      return 0;
    },
    args_get: () => 0,
    environ_sizes_get: (envc, envBufSize) => {
      new DataView(memory.buffer).setUint32(envc, 0, true);
      new DataView(memory.buffer).setUint32(envBufSize, 0, true);
      return 0;
    },
    environ_get: () => 0,
    clock_time_get: (id, precision, timePtr) => {
      const now = BigInt(Date.now()) * 1000000n;
      new DataView(memory.buffer).setBigUint64(timePtr, now, true);
      return 0;
    },
    fd_write: (fd, iovs, iovsLen, nwritten) => {
      const view = new DataView(memory.buffer);
      let written = 0;
      let chunk = "";
      for (let i = 0; i < iovsLen; i++) {
        const ptr = view.getUint32(iovs + i * 8, true);
        const len = view.getUint32(iovs + i * 8 + 4, true);
        chunk += text.decode(new Uint8Array(memory.buffer, ptr, len));
        written += len;
      }
      view.setUint32(nwritten, written, true);
      if (chunk.length) {
        lines.push(chunk);
        console.log(chunk.trimEnd());
      }
      return 0;
    },
    fd_read: () => 0,
    fd_close: () => 0,
    fd_seek: (fd, offset, whence, newOffsetPtr) => {
      new DataView(memory.buffer).setBigUint64(newOffsetPtr, 0n, true);
      return 0;
    },
    // 24-byte fdstat: filetype=2 (character_device) for stdio, zero flags.
    fd_fdstat_get: (fd, statPtr) => {
      new Uint8Array(memory.buffer, statPtr, 24).fill(0);
      new DataView(memory.buffer).setUint8(statPtr, 2);
      return 0;
    },
    clock_res_get: (id, resPtr) => {
      new DataView(memory.buffer).setBigUint64(resPtr, 1000n, true);
      return 0;
    },
    fd_prestat_get: () => 8, // EBADF: no preopened dirs
    fd_prestat_dir_name: () => 8,
    path_open: () => 8,
    random_get: (ptr, len) => {
      crypto.getRandomValues(new Uint8Array(memory.buffer, ptr, len));
      return 0;
    },
    sched_yield: () => 0,
    poll_oneoff: () => 0,
    proc_exit: (code) => { throw new Error("proc_exit " + code); },
  };
  // Everything else the module imports but a no-filesystem page can't honor:
  // errno 8 (EBADF) / 52 (ENOSYS)-style stubs, added generically after
  // enumerating the module's import section.
  for (const name of [
    "fd_fdstat_set_flags", "fd_filestat_get",
    "fd_filestat_set_size", "fd_filestat_set_times", "fd_pread",
    "fd_readdir", "fd_sync", "fd_tell", "path_create_directory",
    "path_filestat_get", "path_filestat_set_times", "path_link",
    "path_readlink", "path_remove_directory", "path_rename",
    "path_symlink", "path_unlink_file",
  ]) {
    if (!(name in wasi)) wasi[name] = () => 8;
  }

  try {
    const response = await fetch("proto_greeter.wasm");
    const { instance } = await WebAssembly.instantiateStreaming(response, {
      wasi_snapshot_preview1: wasi,
    });
    memory = instance.exports.memory;
    instance.exports._start();
    out.textContent = "OK " + lines.join("");
  } catch (e) {
    if (String(e).includes("proc_exit 0")) {
      out.textContent = "OK " + lines.join("");
    } else {
      out.textContent = "FAIL " + e + "\n" + lines.join("");
    }
  }
})();
</script>
</body>
</html>
