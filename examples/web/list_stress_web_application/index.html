<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isomer</title>
  <style>
    :root { color-scheme: light dark; }
    /* Matches Color.windowBackground until the guest's first setColorScheme
       report takes over (which also honours in-app scheme overrides). */
    html, body { margin: 0; height: 100%; background: light-dark(#fff, rgb(18, 18, 20)); }
    #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #error { font: 14px monospace; color: #b00; padding: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <!-- React 18 UMD globals for the ReactRenderer (?renderer=react). -->
  <script src="./runtime/react.production.min.js"></script>
  <script src="./runtime/react-dom.production.min.js"></script>
  <script type="module">
    import { boot } from "./runtime/boot.js";

    // Host-side dependency injection (shared/platform_services — docs/wasm_di.md):
    // this page implements the platform services with browser APIs. Async
    // methods (network, keychain) simply return promises; the generated
    // dispatcher completes the guest's suspended call when they settle.
    const sandbox = "isomer.example.";
    const encoder = new TextEncoder(), decoder = new TextDecoder();
    const toBase64 = (bytes) => btoa(String.fromCharCode(...bytes));
    const fromBase64 = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));
    // No platform services: the probe app uses none.
    const dependencies = {};

    boot({
      canvas: document.getElementById("canvas"),
      wasmURL: "./app.wasm",
      rendererName: new URLSearchParams(location.search).get("renderer") || "react",
      dependencies,
    }).then((result) => {
      // Dev hooks for headless-browser smoke tests, renderer-agnostic (real
      // DOM events at coordinates — the canvas renderer listens for pointer
      // events, the React renderer for clicks on its components):
      //   ?clicks=x,y;x,y   synthetic taps (down+up+click)
      //   ?wheel=x,y,dy;... synthetic wheel scrolls
      const params = new URLSearchParams(location.search);
      //   ?devlog   mirror console warnings/errors into a hidden DOM node
      //   (headless --dump-dom is often the only observable channel)
      if (params.has("devlog")) {
        const sink = document.createElement("pre");
        sink.id = "devlog";
        sink.style.display = "none";
        document.body.appendChild(sink);
        const mirror = (tag, original) => (...args) => {
          sink.textContent += `[${tag}] ${args.map(String).join(" ")}\n`;
          original(...args);
        };
        console.warn = mirror("warn", console.warn.bind(console));
        console.error = mirror("error", console.error.bind(console));
        window.addEventListener("error", (e) => mirror("uncaught", () => {})(e.message));
        window.addEventListener("unhandledrejection", (e) => mirror("rejection", () => {})(e.reason));
      }
      const dispatchAt = (x, y, make) => {
        const el = document.elementFromPoint(x, y);
        if (el) for (const event of make(x, y)) el.dispatchEvent(event);
      };
      const clicks = params.get("clicks");
      if (clicks) {
        // Let each tap's re-render settle before the next; when combined
        // with ?open, wait for the navigation to land first.
        let delay = params.get("open") ? 4000 : 300;
        for (const pair of clicks.split(";")) {
          const [x, y] = pair.split(",").map(Number);
          setTimeout(() => dispatchAt(x, y, (px, py) => [
            new PointerEvent("pointerdown", { clientX: px, clientY: py, bubbles: true, pointerId: 1 }),
            new PointerEvent("pointerup", { clientX: px, clientY: py, bubbles: true, pointerId: 1 }),
            new MouseEvent("click", { clientX: px, clientY: py, bubbles: true }),
          ]), delay);
          delay += 300;
        }
      }
      //   ?open=Wikipedia,Pok,Wikipedia   tap [data-tap] elements by contained
      //   text, in sequence (retries while the tree mounts/loads)
      const open = params.get("open");
      if (open) {
        const labels = open.split(",");
        const openNext = (index) => {
          if (index >= labels.length) return;
          let tries = 0;
          const attempt = () => {
            // Smallest tappable containing the text (rows prepend icon
            // glyphs, ancestors contain everything).
            const el = [...document.querySelectorAll("[data-tap]")]
              .filter((e) => e.textContent.includes(labels[index]) || (e.getAttribute("aria-label") || "").includes(labels[index]))
              .sort((a, b) => a.textContent.length - b.textContent.length)[0];
            if (el) {
              el.click();
              setTimeout(() => openNext(index + 1), 1200);
            } else if (++tries < 20) {
              setTimeout(attempt, 250);
            }
          };
          attempt();
        };
        setTimeout(() => openNext(0), 250);
        // Headless throttles requestAnimationFrame, which async completions
        // rely on for their re-render — pump frames directly for a while so
        // screenshots capture fetched content.
        const pump = setInterval(() => result.bridge?.isoRender?.(), 400);
        setTimeout(() => clearInterval(pump), 45000);
      }
      const wheel = params.get("wheel");
      if (wheel) {
        for (const triple of wheel.split(";")) {
          const [x, y, dy] = triple.split(",").map(Number);
          dispatchAt(x, y, (px, py) => [
            new WheelEvent("wheel", { clientX: px, clientY: py, deltaY: dy, bubbles: true, cancelable: true }),
          ]);
        }
      }
      //   ?type=hello   types into the focused TextField overlay
      const type = params.get("type");
      if (type) {
        setTimeout(() => {
          const overlay = window.__isoTextOverlay;
          if (overlay && overlay.style.display !== "none") {
            overlay.value = type;
            overlay.dispatchEvent(new Event("input"));
          }
        }, 300);
      }
    }).catch((error) => {
      console.error(error);
      const pre = document.createElement("pre");
      pre.id = "error";
      pre.textContent = String(error.stack || error);
      document.body.replaceChildren(pre);
    });
  </script>
</body>
</html>
